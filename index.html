/* 比對上一次的名次，找出這次的變動，並播報「誰、為什麼、變成第幾名」
   ------------------------------------------------------------------
   RANK_SNAP[uid] = { r:名次, g:總得分, d:完成關數, f:是否交卷 } */
function syncRanks(list, selfOnly){
  var sorted=list.slice().sort(rankSort), now={}, evts=[];
  RANK_DELTA={};
  sorted.forEach(function(r,i){
    now[r.uid]={ r:i+1, g:r.gained||0, d:r.done||0, f:r.fin?1:0 };
  });

  if(RANK_SNAP){
    var byOldRank={}, nameOf={};
    for(var u in RANK_SNAP) byOldRank[RANK_SNAP[u].r]=u;
    sorted.forEach(function(r){ nameOf[r.uid]=(r.uid===UID?'你':r.name); });

    sorted.forEach(function(r,i){
      var o=RANK_SNAP[r.uid], nn=i+1, me=(r.uid===UID), who=me?'你':r.name;
      if(!o){
        if(r.done>0) evts.push({p:2, cls:'', t:who+'上榜了，排在第 '+nn+' 名', nm:[r.name]});
        return;
      }
      RANK_DELTA[r.uid]=o.r-nn;

      /* 這一次為什麼會動：加了幾分、破了第幾關、還是交卷了 */
      var dg=(r.gained||0)-o.g, dd=(r.done||0)-o.d, cause='';
      if(dg>0) cause = who+'加了 '+fmtPt(dg)+' 分';
      if(dd>0) cause = cause ? (cause+'、破了第 '+r.done+' 關')
                             : (who+'破了第 '+r.done+' 關');
      if(r.fin && !o.f) cause = who+'交卷了';

      if(nn<o.r){
        var pu=byOldRank[nn], passed=(pu&&pu!==r.uid)?nameOf[pu]:'';
        var tail = (nn===1) ? (me?'衝上第一名了！':'衝上第一名！')
                 : passed   ? ('超過'+passed+'，'+(me?'衝上':'來到')+'第 '+nn+' 名')
                            : ('前進 '+(o.r-nn)+' 名，'+(me?'衝上':'來到')+'第 '+nn+' 名');
        evts.push({p: me?7:(nn===1?5:4), cls:'up', t:(cause? cause+'，':who)+tail, nm:[r.name, passed]});
      }else if(nn>o.r){
        if(me){
          var by='';
          for(var k=0;k<sorted.length;k++){
            var s2=sorted[k], os=RANK_SNAP[s2.uid];
            /* 新上榜（舊名單裡沒有）又排到你前面的人，也算是超過你的人 */
            if(s2.uid!==UID && (!os || os.r>o.r) && (k+1)<nn){ by=s2.name; break; }
          }
          var bg = by ? (function(){
            for(var m=0;m<sorted.length;m++){
              if(sorted[m].name===by){
                var d2=(sorted[m].gained||0)-(RANK_SNAP[sorted[m].uid]||{g:0}).g;
                return d2>0 ? (by+'加了 '+d2+' 分，超過你了') : (by+'超過你了');
              }
            }
            return by+'超過你了';
          })() : '你被超過了';
          evts.push({p:8, cls:'down', t: bg+'，你掉到第 '+nn+' 名', nm:[by]});
        }
      }else if(cause){
        /* 名次沒變，但分數動了也要說一聲，排行榜才不會無聲跳動 */
        evts.push({p: me?3:1, cls:'', t: cause+'，還是第 '+nn+' 名', nm:[r.name]});
      }
    });
  }
  RANK_SNAP=now;

  if(!evts.length) return false;
  evts.sort(function(a,b){ return b.p-a.p; });
  if(selfOnly) evts=evts.filter(function(e){ return e.t.indexOf('你')>=0; });
  if(!evts.length) return false;

  ticker(evts[0].t, evts[0].cls);
  for(var i=0;i<evts.length && i<3; i++) say(evts[i].t, i>0, evts[i].nm);
  if(evts[0].cls==='up' && evts[0].t.indexOf('你')===0) confetti();
  return true;
}

/* 追趕提示：離前一名還差多少（html 給畫面、speak 給語音） */
function chaseInfo(list){
  var sorted=list.slice().sort(rankSort), me=-1;
  for(var i=0;i<sorted.length;i++){ if(sorted[i].uid===UID){ me=i; break; } }
  if(me<0) return {html:'', speak:''};
  if(me===0){
    if(sorted.length<2) return {html:'', speak:''};
    var gap=fmtPt(sorted[0].gained-sorted[1].gained);
    return {
      html:'<div class="chase lead">👑 你是第 1 名，領先第 2 名 <b>'+gap+'</b> 分——別被追上了！</div>',
      speak:'你是第 1 名，領先第 2 名 '+gap+' 分，別被追上了。'
    };
  }
  var up=sorted[me-1], diff=up.gained-sorted[me].gained, diffT=fmtPt(diff);
  if(diff<=0) return {
    html:'<div class="chase">⚡ 你和第 '+(me)+' 名同分，<b>用時比較短就能超過</b>！</div>',
    speak:'你和第 '+me+' 名同分，用時比較短就能超過。'
  };
  return {
    html:'<div class="chase">🔥 再拿 <b>'+diffT+'</b> 分就能超過 '+esc(up.name)+'，衝上第 '+me+' 名！</div>',
    speak:'再拿 '+diffT+' 分就能超過 '+speakName(up.name)+'，衝上第 '+me+' 名。'
  };
}

function boardOff(){

function encodeRec(r){ try{ return UNIT.codePrefix+btoa(unescape(encodeURIComponent(JSON.stringify(r)))); }catch(e){ return ''; } }
function decodeRec(code){
  try{
    code=(code||'').trim().replace(new RegExp('^'+UNIT.codePrefix),'');
    var r=JSON.parse(decodeURIComponent(escape(atob(code))));
    if(r&&r.uid&&typeof r.perf==='number') return r;
  }catch(e){}
  return null;
}

function seatNo(name){
  var t=String(name||''), m=t.match(/(\d+)\s*號/);
  if(m) return parseInt(m[1],10);
  var all=t.match(/\d+/g);
  if(all&&all.length) return parseInt(all[all.length-1],10);
  return 9999;
}

  }).join('');
  app.innerHTML =

    + '<p style="font-weight:800;color:var(--brandink);font-size:16px">'+UNIT.role+'：'+esc(S.name||UNIT.roleAnon)+'</p>'
    + '<p>'+UNIT.intro+'</p>'
    + '<div class="progline">📋 我的進度：完成 <b>'+playedCount+' / '+LEVELS.length+'</b> 關'
    + '　·　總共玩了 <b>'+playTimes+'</b> 次'
    + '<span id="progEst">'+progEstHTML()+'</span></div></div>'

    + '<div class="levels">'+cards+'</div>'
    + '<div class="bonus">📸 <b>加分任務：</b>'+UNIT.bonus+'</div>'
    + (S.finalized
        ? '<div class="finalbar">🔒 <b>成績已經送出了</b><br>'
          + '這個帳號以目前的分數為準，'+(HUNDRED?'每一關':'四關')+'都已鎖住，不能再遊玩。'
          + '<div style="margin-top:8px;font-size:13.5px;color:#8b7a55">'

        : '')
    + '<div class="actions" style="margin-top:18px">'
    + (allDone?'<button class="btn go" id="report">🏅 看'+UNIT.certName+'</button>':'')
    + '<button class="btn main" id="board">🏆 排行榜</button>'
    + (!S.finalized?'<button class="btn stop" id="stopAll">⏹ 結束並送出成績</button>':'')
    + (!S.finalized?'<button class="btn ghost" id="chpet">✏️ 改名字／換'+(UNIT.petWord||'夥伴')+'</button>':'')

    + (S.finalized?'<button class="btn ghost" id="unlock">👩‍🏫 老師解鎖</button>':'')
    + '</div>';
  Array.prototype.forEach.call(app.querySelectorAll('.lv'),function(el){
    el.onclick=function(){
      if(el.classList.contains('locked')){
        sWrong();

        alertBar(S.finalized ? '成績已經送出了，不能再遊玩。'
                 : LEVELS[i].wip ? '這一關還在製作中。'
                 : '要先完成 '+prev.id+' '+prev.name+' 才會解鎖這一關。');

  if(r) r.onclick=function(){ S.score=0;S.stars={};S.unlocked=1;S.records={}; save(); renderMap(); };

}

/* ===================== 關卡流程 ===================== */
function startLevel(li){
  if(S.finalized){ sWrong(); return; }
  if(LEVELS[li].wip){ sWrong(); return; }
  if(li>0 && !S.records[LEVELS[li-1].id]){ sWrong(); return; }
  clearTimer(); boardOff();
  var lv=LEVELS[li];
  G={ li:li, lv:lv, qi:0, tries:0, firstTry:0, wrongTotal:0, combo:0, bestCombo:0,
      codes:{}, gained:0, timeUp:false, sec:0, st:null, paused:false, stopped:false, frozen:false,
      sos:0, sosStep:0 };
  paintScore();
  /* 關卡導引：先用一個簡單的例子說明怎麼玩，按了「開始挑戰」才開始計時 */
  if(lv.demo) renderDemo();
  else runLevel();
}
/* 真正開始這一關（計時從這裡起算） */
function runLevel(){
  var lv=G.lv;
  timeChip.style.display=''; tickPaint();
  timer=setInterval(function(){
    if(G.paused) return;
    G.sec++; tickPaint();
    if(lv.countdown){
      var left=lv.timeLimit-G.sec;
      if(left<=10&&left>0) sTick();
      if(G.sec>=lv.timeLimit){ G.timeUp=true; clearTimer(); finish(); }
    }
  },1000);
  renderQ();
}
/* ---------- 關卡導引畫面 ----------
   lv.demo = { intro:'一句話說明這一關在做什麼',
               steps:[ {t:'步驟標題', d:'說明（可含 HTML）'} , … ],
               example:'示範用的簡單例子（HTML）'，
               note:'操作提醒' }                                   */
function renderDemo(){
  var lv=G.lv, d=lv.demo;
  app.innerHTML =
    '<div class="qhead"><span class="lvname">'+lv.id+'　'+lv.name+'</span>'
    + '<span class="cnt">開始前的說明</span><span class="spacer"></span>'
    + '<button class="btn ghost" style="padding:7px 14px;font-size:14px" id="back">← 回'+UNIT.home+'</button></div>'
    + '<div class="demohead"><div class="demoemoji">'+(d.emoji||'📖')+'</div>'
    + '<h2>'+esc(lv.name)+'　怎麼玩</h2><p>'+d.intro+'</p></div>'
    + (d.example ? '<div class="demoex"><h4>🔎 先看一個例子</h4>'+d.example+'</div>' : '')
    + '<div class="demosteps">'+(d.steps||[]).map(function(x,i){
        return '<div class="dstep"><span class="dnum">'+(i+1)+'</span>'
             + '<div><b>'+x.t+'</b><div class="dsd">'+x.d+'</div></div></div>';
      }).join('')+'</div>'
    + (d.note ? '<div class="demonote">💡 '+d.note+'</div>' : '')
    + '<div class="actions" style="margin-top:18px">'
    + '<button class="btn go" id="demoGo">我知道了，開始挑戰 →</button></div>';
  document.getElementById('back').onclick=function(){ clearTimer(); renderMap(); };
  document.getElementById('demoGo').onclick=function(){ sTap(); runLevel(); };
}
function tickPaint(){
  var lv=G.lv;
  if(lv.countdown){
    var left=lv.timeLimit-G.sec;
    timeChip.textContent='⏱ '+left;
    timeChip.className='chip'+(left<=20?' warn':'');
  }else{
    timeChip.textContent='⏱ '+fmt(G.sec);
    timeChip.className='chip'+(G.sec>lv.target?' over':'');
  }
}
function clearTimer(){ if(timer){clearInterval(timer);timer=null;} timeChip.style.display='none'; }

function renderQ(){
  var lv=G.lv, it=lv.items[G.qi];
  G.tries=0; G.sosStep=0;
  var pct=Math.round(G.qi/lv.items.length*100);
  var M=MODES[lv.mode];
  if(!M){ app.innerHTML='<div class="fb no">找不到玩法模組：'+esc(lv.mode)+'</div>'; return; }
  var sub = M.sub ? M.sub(it,lv) : '';
  var stage = M.stage(it,lv);

  app.innerHTML =
    '<div class="qhead"><span class="lvname">'+lv.id+'　'+lv.name+'</span>'
    + '<span class="cnt">第 '+(G.qi+1)+' / '+lv.items.length+' 題</span><span class="spacer"></span>'
    + '<button class="btn ghost" style="padding:7px 14px;font-size:14px" id="back">← 回'+UNIT.home+'</button></div>'
    + '<div class="bar"><i style="width:'+pct+'%"></i></div>'
    + (pet().lines ? '<div class="buddyrow"><div class="buddy talker" id="buddy">'+pet().f+'</div>'
                     + '<div class="bubble" id="bubble"></div></div>'
                   : '<div class="buddy" id="buddy">'+pet().f+'</div>')
    + '<div class="qtext">'+(M.title?M.title(it,lv):'')+'</div>'
    + '<div class="qsub">'+(HUNDRED?'<b class="qpt">本題 '+fmtPt(it.pt)+' 分</b>　'+sub:sub)+'</div>'
    + '<div class="hintbox">💡 '+lv.hint+'</div>'
    + '<div id="fb"></div>'
    + '<div class="stage" id="stage">'+(G.combo>=2?'<div class="combo">🔥 連續答對 ×'+G.combo+'</div>':'')+stage+'</div>'
    + '<div class="actions">'
    + (M.noCheck?'':'<button class="btn main" id="check">確定！</button>')
    + (sosList(it,lv).length?'<button class="btn ghost" id="sos">🆘 求救</button>':'')
    + '</div>'
    + '<div id="sosbox"></div>';
  document.getElementById('back').onclick=function(){ clearTimer(); renderMap(); };
  var ck=document.getElementById('check');
  if(ck) ck.onclick=check;
  var sb=document.getElementById('sos');
  if(sb) sb.onclick=showSos;
  buddyTalk(G.qi===0?'hi':'ask');
  bindStage();
}
/* ---------- 求救：一層一層給提示，永遠不給最後答案 ----------
   提示來源：題目的 it.sos（陣列），或玩法模組的 M.sos(it,lv) 回傳陣列 */
function sosList(it,lv){
  var M=MODES[lv.mode];
  var l = (M && M.sos) ? M.sos(it,lv) : it.sos;
  return (l && l.length) ? l : [];
}
function showSos(){
  var lv=G.lv, it=lv.items[G.qi], list=sosList(it,lv);
  if(!list.length) return;
  if(G.sosStep>=list.length){ sTap(); return; }
  G.sosStep++; G.sos++;
  sPick(); buddyTalk('sos');
  var box=document.getElementById('sosbox');
  box.innerHTML = '<div class="sosbox"><h4>🆘 一起想一想（'+G.sosStep+' / '+list.length+'）</h4>'
    + list.slice(0,G.sosStep).map(function(t,i){
        return '<div class="sosline"><span class="sn">'+(i+1)+'</span><div>'+t+'</div></div>';
      }).join('')
    + (G.sosStep<list.length
        ? '<div class="sosmore">還是不會？再按一次「🆘 求救」看下一個提示。</div>'
        : '<div class="sosmore done">提示到這裡為止——最後一步要自己算出來喔！</div>')
    + '</div>';
  var b=document.getElementById('sos');
  if(b) b.textContent = G.sosStep<list.length ? '🆘 再給一個提示' : '🆘 提示給完了';
}
function buddyReact(kind){
  var b=document.getElementById('buddy'); if(!b) return;
  var base=b.classList.contains('talker')?'buddy talker':'buddy';
  b.className=base; void b.offsetWidth; b.className=base+' '+kind;
  buddyTalk(kind==='happy'?'right':'wrong');
}
/* 會說話的夥伴：pet().lines = { hi, ask, right, wrong, sos }，每項是一串台詞，隨機挑一句 */
function buddyTalk(kind){
  var p=pet(), el=document.getElementById('bubble');
  if(!el || !p.lines || !p.lines[kind] || !p.lines[kind].length) return;
  var arr=p.lines[kind], t=arr[Math.floor(Math.random()*arr.length)];
  el.innerHTML='<b>'+esc(p.n)+'：</b>'+t;
  el.className='bubble'; void el.offsetWidth; el.className='bubble pop';
}

function bindStage(){
  var M=MODES[G.lv.mode];
  if(M && M.bind) M.bind();
}
function noteMis(code){
  G.codes[code]=(G.codes[code]||0)+1;
}

/* ---------- 選擇題的小處罰：扣分 + 罰停 1 秒 ---------- */

function isChoiceMode(){
  var M=MODES[G.lv.mode];
  if(!M) return false;
  return typeof M.choice==='function' ? !!M.choice() : !!M.choice;
}
function sPenalty(){ tone(300,.14,'square',.14); tone(200,.22,'square',.13,.13); }
function floatPen(txt){
  var r=scoreChip.getBoundingClientRect();
  var d=document.createElement('div');
  d.className='floatpen'; d.textContent=txt;
  d.style.left=(r.left+r.width/2-18)+'px';
  d.style.top=(r.top+4)+'px';
  document.body.appendChild(d);
  setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); },1000);
}
/* hard=true：猜得到的題型（扣分＋停 10 秒）
   hard=false：動手操作型（不扣分，只停 3 秒，讓學生慢下來但不怕嘗試） */
function applyPenalty(hard){
  var ms = hard ? FREEZE_MS : SOFT_FREEZE_MS;
  if(hard && !HUNDRED){
    G.gained=Math.max(0,G.gained-PENALTY);
    S.score=Math.max(0,S.score-PENALTY);
    paintScore(); save();
    floatPen('−'+PENALTY);
    scoreChip.classList.add('hit');
    setTimeout(function(){ scoreChip.classList.remove('hit'); },620);
  }
  sPenalty();

  /* 罰停：選項與確定鍵鎖住
     記住是哪一局：罰停期間學生可能已經離開關卡（G 變成 null）或開了新的一關 */
  var g=G;
  g.frozen=true;
  var stage=document.getElementById('stage');
  var btn=document.getElementById('check');
  if(stage) stage.classList.add('frozen');
  if(btn) btn.disabled=true;
  var fb=document.querySelector('.fb');
  var bar=document.createElement('div');
  bar.className='freezebar'; bar.id='freezebar';
  var tail = hard ? '秒…利用這段時間把上面的提示看一次' : '秒…慢慢來，再檢查一次';
  bar.innerHTML='⏳ 罰停 <b>'+Math.round(ms/1000)+'</b> '+tail;
  if(fb) fb.appendChild(bar);
  var t0=Date.now();
  var iv=setInterval(function(){
    var rest=Math.max(0,Math.ceil((ms-(Date.now()-t0))/1000));
    var b=document.getElementById('freezebar');
    if(b) b.innerHTML='⏳ 罰停 <b>'+rest+'</b> '+tail;
  },200);
  setTimeout(function(){
    clearInterval(iv);
    g.frozen=false;
    if(G!==g) return;
    var st=document.getElementById('stage'); if(st) st.classList.remove('frozen');
    var bt=document.getElementById('check'); if(bt) bt.disabled=false;
    var b=document.getElementById('freezebar');
    if(b) b.outerHTML='<div class="freezebar done">✅ 可以再試一次了</div>';
    sTap();
  },ms);
}

/* ===================== 判題 ===================== */
function check(){
  if(G&&G.frozen) return;
  var lv=G.lv, it=lv.items[G.qi], M=MODES[lv.mode];
  G.tries++;
  var res = M.judge(it,lv) || {};
  /* halt：題目還沒作答完，不算一次嘗試，也不罰
     tone:'ok' 用在多步驟的關卡——這一步做對了，繼續下一步 */
  if(res.halt){
    var tone = res.tone==='ok' ? 'ok' : 'no';
    showFb(tone, res.msg||'還沒做完喔。');
    G.tries--;
    if(tone==='ok'){ sPick(); }
    else { sWrong(); flash('no'); }
    return;
  }
  if(res.ok) onRight(it); else onWrong(it, res.code||null);
}
function onRight(it){
  var lv=G.lv;
  G.combo++; if(G.combo>G.bestCombo) G.bestCombo=G.combo;
  var base = G.tries===1?10:4;
  var bonus = (G.tries===1 && G.combo>=3) ? 3 : 0;
  if(HUNDRED){ base = G.tries===1 ? (it.pt||0) : (G.tries===2 ? (it.pt||0)/2 : 0); bonus = 0; }
  if(G.tries===1) G.firstTry++;
  G.gained+=base+bonus; S.score+=base+bonus; paintScore();
  buddyReact('happy'); flash('ok');
  if(G.combo>=3) sCombo(G.combo); else sRight();
  burstAt(document.getElementById('stage'),['#ffb020','#2fa46b','#fff','#3aa6e0'],40);

  var msg = G.tries===1?('✅ 答對了！＋'+base+' 分'):('✅ 這次對了！＋'+base+' 分');
  if(HUNDRED) msg = G.tries===1 ? ('✅ 答對了！＋'+fmtPt(base)+' 分（本題 '+fmtPt(it.pt)+' 分）')
                : base>0 ? ('✅ 訂正成功！＋'+fmtPt(base)+' 分（本題 '+fmtPt(it.pt)+' 分，訂正拿一半）')
                         : ('✅ 做對了！看過答案才做對，這題不加分（本題 '+fmtPt(it.pt)+' 分）');
  if(bonus) msg += '　🔥 連續答對 ×'+G.combo+' 追加 ＋'+bonus+' 分';
  var M=MODES[G.lv.mode];
  var extra = M.onRight ? M.onRight(it) : null;
  if(extra && extra.msg) msg += extra.msg;
  showFb('ok',msg);
  var chk=document.getElementById('check');
  if(chk) chk.disabled=true;
  /* after：模組要改畫面的副作用，等回饋和按鈕都處理完才跑 */
  if(extra && extra.after) extra.after();
  /* hold：模組自己接管接下來的流程（例如換鈔機要先動手驗證） */
  if(extra && extra.hold) return;
  nextButton();
}
/* 玩法模組接管流程時，可以自己叫出「下一題」 */
function nextButton(){
  var last=G.qi+1>=G.lv.items.length;
  var act=document.querySelector('.actions');
  if(!act) return;
  act.innerHTML='<button class="btn go" id="next">'+(last?'看結果 →':'下一題 →')+'</button>';
  var b=document.getElementById('next');
  b.onclick=function(){
    G.qi++; sTap();
    if(G.qi<G.lv.items.length) renderQ(); else { clearTimer(); finish(); }
  };
  b.focus();
}
function onWrong(it,code){
  G.combo=0; G.wrongTotal++;
  buddyReact('sad'); sWrong(); flash('no');
  var pen=isChoiceMode();
  var m='';
  if(HUNDRED) m += '<div class="penline'+(pen?'':' soft')+'">'+(pen?'⛔ <b>選錯了</b>':'⏳ <b>再試一次</b>')
             + '　·　'+(G.tries===1?'訂正後可以拿這題一半的分數':'這題已經沒有分數了，但還是要做對')
             + '　·　先停 <b>'+Math.round((pen?FREEZE_MS:SOFT_FREEZE_MS)/1000)+' 秒</b></div>';
  else if(pen) m += '<div class="penline">⛔ <b>選錯了</b>　扣 <b>'+PENALTY+' 分</b>　·　罰停 <b>'
             + Math.round(FREEZE_MS/1000)+' 秒</b></div>';
  else    m += '<div class="penline soft">⏳ <b>再試一次</b>　不扣分　·　先停 <b>'
             + Math.round(SOFT_FREEZE_MS/1000)+' 秒</b>，把下面的提示看一次</div>';
  if(code){ noteMis(code); m+='💡 '+MIS[code]+'<span class="code">'+code+'</span>'; }
  else m+='再想想看：'+G.lv.hint;
  var M=MODES[G.lv.mode];
  var ex = M.onWrong ? M.onWrong(it,code) : null;
  if(ex && ex.msg) m += ex.msg;
  if(!(ex && ex.hold) && G.tries>=2) m += '<div class="ans">'+answerText(it)+'</div>';
  showFb('no',m);
  if(ex && ex.after) ex.after();
  applyPenalty(pen);
}
function answerText(it){
  var M=MODES[G.lv.mode];
  return (M && M.answer) ? M.answer(it) : '';
}
function showFb(kind,html){
  document.getElementById('fb').innerHTML='<div class="fb '+kind+'">'+html+'</div>';
}

/* ===================== 停止鍵：先推算點數，再決定要不要停 ===================== */
function estimatePoints(provPerf){
  /* 沒玩過的關卡一律算 0 分——只玩一關不可能拿到滿點 */
  var sum=0, got=0;
  LEVELS.forEach(function(lv){
    if(G && lv.id===G.lv.id){ if(provPerf!=null){ sum+=provPerf; got++; } return; }
    var r=S.records[lv.id]; if(r){ sum+=r.perf; got++; }
  });
  if(!got) return null;
  var avg=sum/LEVELS.length;
  return { avg:avg, n:got, C:curvePoints(avg) };
}
/* 依排行榜推算：現在收手可以拿幾點 */
function rankEstHTML(est){
  var me=provisionalSummary();
  var R=myRankNow(me);
  if(HUNDRED) return '<div class="ptrow"><span>目前總分</span><b>'+fmtPt(me.gained)+' / 100 分</b></div>'
      + '<div class="ptrow"><span>目前總用時</span><b>'+fmt(me.secs)+'</b></div>'
      + '<div class="ptrow"><span>完成關卡</span><b>'+me.done+' / '+LEVELS.length+' 關</b></div>'
      + '<div class="ptrow"><span>班上排名（總分高→用時短）</span><b>第 '+R.rank+' 名 / 共 '+R.n+' 人</b></div>'
      + '<div class="estsub">沒玩的關卡沒有分數。</div>';
  var h='<div class="ptrow"><span>目前總得分（四關累計）</span><b>'+me.gained+' 分</b></div>'
      + '<div class="ptrow"><span>目前總用時</span><b>'+fmt(me.secs)+'</b></div>'
      + '<div class="ptrow"><span>完成關卡</span><b>'+me.done+' / '+LEVELS.length+' 關</b></div>';
  if(R.pts){

/* ===================== 單關結算 ===================== */
function finish(){
  clearTimer();
  var lv=G.lv, total=lv.items.length;
  var P=levelPerf(G.firstTry,total,G.sec,lv.target,G.timeUp);
  var stars=P.perf>=NEED_3?3:P.perf>=NEED_2?2:1;
  if(HUNDRED){ var ratio=lvMax(lv)?G.gained/lvMax(lv):0; stars=ratio>=0.9?3:ratio>=0.7?2:1; }
  if(stars>(S.stars[lv.id]||0)) S.stars[lv.id]=stars;
  var old=S.records[lv.id];
  var plays=(old&&old.plays?old.plays:0)+1;
  var kept = !!old && !betterRun(G.gained,G.sec,old);
  if(!kept){
    S.records[lv.id]={sec:G.sec,gained:G.gained,firstTry:G.firstTry,total:total,
                      acc:P.acc,spd:P.spd,perf:P.perf,timeUp:G.timeUp,
                      stopped:!!G.stopped,done:G.qi,plays:plays,sos:G.sos||0};
  }else{
    old.plays=plays;
  }
  save(); paintScore(); pushScore(function(){ refreshClass(paintRank); });
  if(!G.timeUp&&!G.stopped){ sClear(); confetti(); if(stars===3) setTimeout(function(){sStar();confetti();},450); }
  else if(G.stopped) sMerge();
  else sWrong();

  var codes=Object.keys(G.codes).map(function(c){return [c,G.codes[c]];}).sort(function(a,b){return b[1]-a[1];});
  var remember = codes.length
    ? '<div class="remember"><h4>📌 這一關要特別記住</h4><ul>'
      + codes.map(function(p){return '<li>'+MIS[p[0]]+'<span class="code">'+p[0]+' ×'+p[1]+'</span></li>';}).join('')
      + '</ul></div>'
    : (G.wrongTotal
        ? '<div class="allgood">👍 '+(UNIT.slipText||'沒有踩到常見的迷思陷阱，錯的是操作上的小失誤。')+'</div>'
        : '<div class="allgood">🎉 全部一次做對，'+(UNIT.praiseText||'這一關的觀念很穩！')+'</div>');
  var allDone=LEVELS.every(function(l){return S.records[l.id];});

  app.innerHTML =
    '<div class="rhead"><div class="emoji">'+pet().f+(G.timeUp?'⏰':(stars===3?'🏆':stars===2?'🎖️':'💪'))+'</div>'
    + '<h2>'+(G.timeUp?'時間到！':(G.stopped?lv.id+' '+lv.name+'　提早結算':lv.id+' '+lv.name+' 完成'))+'</h2>'
    + '<div style="font-size:26px;letter-spacing:3px;color:#ffb020">'+'★'.repeat(stars)+'☆'.repeat(3-stars)+'</div></div>'
    + (kept?'<div class="chase">📌 這次 '+fmtPt(G.gained)+' 分，沒有超過之前的 <b>'+fmtPt(old.gained)+' 分</b>，保留之前比較好的成績。</div>':'')
    + '<div class="rstats">'
    + '<div class="stat"><b>'+fmt(G.sec)+'</b><span>⏱ 用時</span></div>'
    + '<div class="stat"><b>'+G.firstTry+'/'+total+'</b><span>一次就做對</span></div>'
    + (G.stopped?'<div class="stat"><b>'+G.qi+'/'+total+'</b><span>⏹ 做到第幾題</span></div>':'')
    + (HUNDRED ? '<div class="stat pt"><b>'+fmtPt(G.gained)+' / '+fmtPt(lvMax(lv))+'</b><span>⭐ 本關得分</span></div>'
               + (G.sos ? '<div class="stat"><b>'+G.sos+'</b><span>🆘 求救次數</span></div>' : '') + '</div>'
               + '<div class="ptbox"><h4>⭐ 分數怎麼算的</h4>'
               + '<div class="ptrow"><span>'+(lv.items.every(function(x){ return x.pt===lv.items[0].pt; })
                   ? '每一題 '+fmtPt(lv.items[0].pt)+' 分，共 '+total+' 題'
                   : '每一題的配分不一樣（題目下方會寫「本題 幾分」）')+'</span><b>本關 '+fmtPt(lvMax(lv))+' 分</b></div>'
               + '<div class="ptrow"><span>一次做對 '+G.firstTry+'/'+total+' 題：拿滿分；訂正後做對：拿一半</span><b>'+fmtPt(G.gained)+' 分</b></div>'
               + '<div class="ptrow"><span>全部關卡加起來</span><b>滿分 100 分</b></div></div>'
    : '<div class="stat"><b>+'+G.gained+'</b><span>⭐ 本關得分</span></div>'
    + '<div class="stat"><b>×'+G.bestCombo+'</b><span>🔥 最長連擊</span></div>'
    + (G.sos ? '<div class="stat"><b>'+G.sos+'</b><span>🆘 求救次數</span></div>' : '')

    + '<div class="ptbox"><h4>🎁 本關表現怎麼算的（正確度 × 速度倍率）</h4>'
    + '<div class="ptrow"><span>正確度：一次做對 '+G.firstTry+'/'+total+'</span><b>'+pctText(P.acc)+'</b></div>'
    + '<div class="ptrow"><span>速度倍率：用時 '+fmt(G.sec)+'（'+fmt(P.fast)+' 以內才是滿倍率）'

              :'<button class="btn main" id="map">回'+UNIT.home+' →</button>')

  document.getElementById('again').onclick=function(){ startLevel(G.li); };

  var rp=document.getElementById('report'); if(rp) rp.onclick=renderReport;
}

      +'<td class="miss">—</td><td class="miss">—</td><td class="miss">未挑戰</td></tr>';

      +'<td class="pts">'+(HUNDRED?(lvMax(lv)?pctText(r.gained/lvMax(lv)):'—'):pctText(r.perf))+'</td></tr>';

  var perfAll=perfSum/LEVELS.length, C=curvePoints(perfAll);

    + '<tbody>'+rows+'</tbody></table></div>'
    + '<div class="grand">'
    + '<div class="stat"><b>'+fmt(secs)+'</b><span>⏱ 總用時</span></div>'
    + '<div class="stat"><b>'+ft+'/'+tot+'</b><span>一次做對</span></div>'
    + (HUNDRED ? '<div class="stat pt"><b>'+fmtPt(gained)+' / 100</b><span>⭐ 總分</span></div></div>'
               + '<div class="rank"><div class="big">⭐ '+fmtPt(gained)+' 分</div><div class="ttl">'+rank+'</div>'
               + '<div class="sub">班上排名 <b>第 '+R.rank+' 名 / 共 '+R.n+' 人</b>（依總分 '+fmtPt(me.gained)+' 分、總用時 '+fmt(me.secs)+'）。</div></div>'
    : '<div class="stat"><b>'+gained+'</b><span>⭐ 總得分</span></div>'
    + '<div class="stat pt"><b>'+pctText(perfAll)+'</b><span>🎁 平均表現</span></div></div>'
    + '<div class="rank"><div class="big">🎁 '+finalPts+' 點</div><div class="ttl">'+rank+'</div>'
    + '<div class="sub">'
    + (R.pts
        ? '班上排名 <b>第 '+R.rank+' 名 / 共 '+R.n+' 人</b>（依總得分 '+me.gained+' 分、總用時 '+fmt(me.secs)+'）。<br>'
          + '前 1/3 給 3 點、中間 1/3 給 2 點、後 1/3 給 1 點。'
        : '班上人數不足 '+MIN_CLASS+' 人，改用絕對標準：四關平均表現 '+pctText(perfAll)

    return '<ellipse cx="'+x+'" cy="'+y+'" rx="'+r+'" ry="'+(r*1.18)+'" fill="'+SCI_INK+'"/>'
         + '<circle cx="'+(x+r*0.35)+'" cy="'+(y-r*0.45)+'" r="'+(r*0.42)+'" fill="#fff"/>';

/* ============================================================
   L1 的場景圖（SVG，viewBox 600×240）
   畫面只顯示「你設定了什麼」；做出來的結果要按了啟動才會出現，避免邊調邊看答案。
   ============================================================ */
function xSvg(inner, bg){
  return '<svg class="xsvg" viewBox="0 0 600 240" xmlns="http://www.w3.org/2000/svg">'
       + '<rect width="600" height="240" fill="'+(bg||'#dff1fb')+'"/>'+inner+'</svg>';
}
function xT(x,y,t,size,fill,anchor){
  return '<text x="'+x+'" y="'+y+'" font-size="'+(size||18)+'" font-weight="800" fill="'+(fill||'#16323c')
       + '" text-anchor="'+(anchor||'middle')+'">'+t+'</text>';
}
function xTag(x,y,t,fill){   /* 白底標籤 */
  var w=t.length*19+18;
  return '<rect x="'+(x-w/2)+'" y="'+(y-21)+'" width="'+w+'" height="30" rx="9" fill="#fff" opacity=".92" stroke="'+(fill||'#1f5568')+'" stroke-width="2"/>'
       + xT(x,y,t,18,fill||'#1f5568');
}
function xDeg(t){ return t<0 ? '零下 '+(-t)+'℃' : t+'℃'; }   /* 負號容易被看漏，寫成「零下」 */
function xCloud(x,y,s,fill){
  fill=fill||'#fff';
  return '<g fill="'+fill+'" stroke="#9bb4c2" stroke-width="2"><ellipse cx="'+x+'" cy="'+y+'" rx="'+(46*s)+'" ry="'+(20*s)+'"/>'
       + '<ellipse cx="'+(x-22*s)+'" cy="'+(y-12*s)+'" rx="'+(24*s)+'" ry="'+(17*s)+'"/>'
       + '<ellipse cx="'+(x+18*s)+'" cy="'+(y-15*s)+'" rx="'+(28*s)+'" ry="'+(20*s)+'"/></g>';
}
var X_LAND = '<polygon points="0,205 150,95 250,175 370,75 540,205" fill="#86ad8f"/>'
           + '<rect y="200" width="600" height="40" fill="#5c9b57"/>'
           + '<path d="M40,200 l5,-12 l5,12 M95,200 l5,-12 l5,12 M250,200 l5,-12 l5,12 M300,200 l5,-12 l5,12 M350,200 l5,-12 l5,12 M470,200 l5,-12 l5,12 M540,200 l5,-12 l5,12" stroke="#2f6b33" stroke-width="3" fill="none"/>';

/* 1 結霜：位置 × 氣溫 */
function xScFrost(sel,out){
  var h=X_LAND, hi=sel.pos==='hi', y=hi?52:182;
  if(out){
    if(out.key==='vapor') h+='<circle cx="300" cy="'+y+'" r="26" fill="none" stroke="#5b7b92" stroke-width="3" stroke-dasharray="6 5"/>'+xTag(300,y+58>230?y-40:y+58,'水蒸氣（看不見）');
    if(out.key==='cloud') h+=xCloud(300,58,1.2)+xTag(300,112,out.name);
    if(out.key==='dew')   h+=xT(255,198,'💧',24)+xT(300,198,'💧',24)+xT(345,198,'💧',24)+xTag(300,160,'露（小水珠）');
    if(out.key==='frost') h+=xT(255,198,'❄️',24)+xT(300,198,'❄️',24)+xT(345,198,'❄️',24)+xTag(300,160,'霜（冰晶）');
  }else if(sel.pos){
    h+='<circle cx="300" cy="'+y+'" r="26" fill="#ffffff66" stroke="#5b7b92" stroke-width="3" stroke-dasharray="6 5"/>'+xT(300,y+6,'水蒸氣',15,'#3f5f72');
  }
  if(sel.temp!=null) h+=xTag(500,hi?52:150,'🌡 '+xDeg(sel.temp),'#b3450a');
  return xSvg(h,'#bfe4f8');
}
/* 2 下雪：水氣 × 地面氣溫 */
function xScSnow(sel,out){
  var h=X_LAND, big=sel.water!=='few';
  h+=xCloud(300,50,big?1.5:0.8)+xT(300,54,big?'❄ ❄ ❄':'❄',big?18:14,'#4f8fe6');
  if(sel.water) h+=xTag(110,40,sel.water==='rich'?'水氣充足':'水氣很少','#1f5568');
  if(sel.gt!=null) h+=xTag(495,185,'🌡 地面 '+xDeg(sel.gt),'#b3450a');
  if(out){
    if(out.key==='snow') h+=xT(300,100,'❄️',22)+xT(285,135,'❄️',22)+xT(310,168,'❄️',22)+'<rect x="180" y="194" width="240" height="12" rx="6" fill="#fff"/>'+xTag(140,150,'積雪了');
    if(out.key==='rain') h+=xT(300,100,'❄️',22)+xT(300,140,'💧',22)+xT(288,175,'💧',22)+xT(312,195,'💧',22)+xTag(135,135,'半路融化成雨');
    if(out.key==='none') h+=xTag(300,130,'沒有東西掉下來');
  }
  return xSvg(h,'#bfe4f8');
}

/* 地圖底圖：左上是亞洲大陸，中間偏右是臺灣 */
var X_MAP = '<path d="M0,0 L340,0 L310,38 L262,66 L240,118 L176,158 L122,148 L62,188 L0,178 Z" fill="#e8d9a8" stroke="#c9b87a" stroke-width="2"/>'
          + '<ellipse cx="365" cy="150" rx="13" ry="30" transform="rotate(14 365 150)" fill="#7fbf7a" stroke="#3f8a45" stroke-width="2"/>';
/* 沿著一條線畫鋒面符號。type：cold／warm／stay；dx,dy 是整條線的平移 */
function xFront(type,dx,dy){
  var ax=230+dx, ay=228+dy, bx=500+dx, by=78+dy;
  var len=Math.sqrt((bx-ax)*(bx-ax)+(by-ay)*(by-ay)), ux=(bx-ax)/len, uy=(by-ay)/len, nx=-uy, ny=ux;  /* n 指向東南（暖氣團那一側） */
  var col= type==='cold'?'#2f6fdc':(type==='warm'?'#e0483c':'#6b4fb0');
  var h='<line x1="'+ax+'" y1="'+ay+'" x2="'+bx+'" y2="'+by+'" stroke="'+col+'" stroke-width="4"/>';
  for(var i=0;i<5;i++){
    var t=0.12+i*0.19, px=ax+(bx-ax)*t, py=ay+(by-ay)*t;
    var tri=(type==='cold')||(type==='stay'&&i%2===0);
    if(tri) h+='<polygon points="'+(px-ux*9)+','+(py-uy*9)+' '+(px+ux*9)+','+(py+uy*9)+' '+(px+nx*15)+','+(py+ny*15)+'" fill="#2f6fdc"/>';
    else    h+='<path d="M'+(px-ux*9)+','+(py-uy*9)+' A9,9 0 0 1 '+(px+ux*9)+','+(py+uy*9)+' Z" fill="#e0483c"/>';
  }
  return h;
}

  if(w) h+='<circle cx="500" cy="186" r="'+(26+w*13)+'" fill="#ef6a5a" opacity=".5"/>'+xT(500,182,'暖氣團',17,'#7a1d12')+xT(500,204,['','弱','中','強'][w],17,'#7a1d12');
  h+=xT(392,146,'臺灣',15,'#1f5a25','start');

    if(out.front==='warm'){ h+=xFront(sel.sym||'warm',-34,-22)+'<path d="M440,170 l-40,-34 m0,0 l14,2 m-14,-2 l2,14" stroke="#7a1d12" stroke-width="4" fill="none"/>'+xTag(455,30,'暖鋒往北推進','#7a1d12'); }
    if(out.front==='stay'){ h+=xFront(sel.sym||'stay',0,0)+xT(365,112,'🌧️',26)+xTag(455,30,'鋒面停在原地','#4a2f8a'); }

  /* ---------------- L2 神祕燒杯鑑識（水溶液） ---------------- */
  { id:"L2", tier:"水溶液", name:"神祕燒杯鑑識", mode:"lab", countdown:false, target:600,
    desc:"燒杯沒有標籤，檢驗次數有限。挑對檢驗工具、看懂結果，才認得出哪一杯是哪一種水溶液。",
    hint:"檢驗次數<b>有限</b>，先想「哪一種檢驗分得出它們」再動手。結果只會告訴你現象（變色、發亮），是什麼性質要自己判斷。",
    demo:{ emoji:'🧪',
      intro:'這一關你是化驗員。桌上的燒杯看起來都一樣，要靠檢驗工具找出答案。',
      example:'<div class="exrow"><span class="exbox">任務：找出<b>汽水</b></span><span class="exarrow">→</span>'
            + '<span class="exbox">拿<b>藍色石蕊試紙</b>驗甲杯</span><span class="exarrow">→</span>'
            + '<span class="exbox">變成紅色 ＝ 酸性</span><span class="exarrow">→</span>'
            + '<span class="exbox">甲杯「就是這一杯」</span></div>'
            + '<div class="exnote">如果拿紅色石蕊試紙去驗，酸性和中性都「不變色」，就分不出來，白白用掉一次機會。</div>',
      steps:[ {t:'第一步：選工具', d:'先點一樣檢驗工具，再點要檢驗的燒杯，結果會記在紀錄表裡。'},
              {t:'第二步：看懂結果', d:'紀錄表只寫現象，例如「變成藍色」「不亮」，代表什麼性質要自己想。'},
              {t:'第三步：指認', d:'有把握了就按那一杯下面的「就是這一杯」。指認錯會扣分，不要用猜的。'} ],
      note:'八題裡有幾題不是找燒杯，而是要你動手修理或調配，看任務卡就知道。' },
    items:[
      { type:'find', icon:'💧', title:'找出純水',
        goal:'兩杯看起來一模一樣的水，一杯是純水、一杯是自來水。做導電實驗要用純水來配水溶液。你只能檢驗 <b>1 次</b>。',
        ask:'哪一杯是純水？', beakers:['tap','water'], ans:1, tools:['red','blue','led'], budget:1, code:'PURE_TAP',
        learn:'自來水裡溶有其他物質，容易導電；<b>純水</b>沒有其他物質溶解，不會導電，所以適合當對照組，也適合用來配其他水溶液。',
        answer:'正解：用「LED 導電測試」驗其中一杯。會亮的是自來水，不亮的才是純水（乙杯）。',
        sos:['純水和自來水都是中性的，石蕊試紙分得出來嗎？',
             '自來水裡溶有一些其他物質，純水裡什麼都沒有。這會讓哪一種性質不一樣？',
             '想想為什麼手溼的時候不可以碰插座。'] },

      { type:'find', icon:'🧂', title:'找出食鹽水',
        goal:'四杯分別是砂糖水、食鹽水、小蘇打水和醋，標籤掉了。你最多可以檢驗 <b>6 次</b>。',
        ask:'哪一杯是食鹽水？', beakers:['sugar','vinegar','salt','soda'], ans:2, tools:['red','blue','led'], budget:6, code:'FIND_SALT',
        learn:'<b>食鹽水</b>是中性（紅、藍石蕊試紙都不變色），而且容易導電。砂糖水也是中性，但是不容易導電；醋是酸性、小蘇打水是鹼性。',
        answer:'正解：丙杯。它讓紅、藍石蕊試紙都不變色（中性），又能讓 LED 發亮（容易導電）。',
        sos:['先想這四種水溶液各是酸性、中性還是鹼性。裡面有兩種是一樣的。',
             '酸鹼性一樣的那兩種，還有什麼性質不一樣？',
             '例如要分辨檸檬汁和汽水以外的東西，會先用試紙分成酸、中、鹼三堆，再用另一種檢驗分開同一堆裡的。'] },

      { type:'find', icon:'🍬', title:'找出砂糖水',
        goal:'三杯透明的液體：純水、砂糖水、酒精水溶液。它們都是中性，也都不容易導電。你最多可以檢驗 <b>3 次</b>。',
        ask:'哪一杯是砂糖水？', beakers:['water','sugar','alcohol'], ans:1, tools:['led','red','evap'], budget:3, code:'EVAP_BACK',
        learn:'把水蒸乾，原本溶在水裡的固體會<b>留下來</b>，可見溶解不是消失。酒精是液體，會和水一起蒸發，所以什麼都不留。早期的鹽田也是這樣晒出粗鹽的。',
        answer:'正解：用「蒸發皿」把三杯蒸乾，只有乙杯留下白色顆粒，它就是砂糖水。',
        sos:['題目已經說三杯都是中性、都不容易導電，所以哪些工具驗了也是白驗？',
             '砂糖是固體，溶在水裡看不見了。它消失了嗎？',
             '想想海水怎麼變成鹽：水不見之後，原本溶在裡面的東西會怎麼樣？'] },

      { type:'act', icon:'💡', title:'修好導電測試器',
        goal:'小翔要測食鹽水會不會導電，可是 LED 不亮。看他的接法，選一個做法把測試器修好。',
        diagram:'🔋 正極 ──── <b>短腳</b> 〔LED〕 <b>長腳</b> ──── 食鹽水 ──── 負極 🔋',
        acts:[ ['touch','讓水裡的兩條電線碰在一起', 'LED 還是不亮。而且電線互相碰到的話，電不會經過水溶液，根本測不到水溶液。', 'LED_LEG'],
               ['flip', '把 LED 轉過來，讓長腳接正極那一端', 'LED 亮了！', null],
               ['more', '再多加幾匙食鹽', 'LED 還是不亮。問題不在食鹽水。', 'LED_LEG'],
               ['sugar','把食鹽水換成砂糖水', 'LED 還是不亮。砂糖水本來就不容易導電，而且電路也還沒修好。', 'LED_LEG'] ],
        learn:'發光二極體有方向：<b>長腳</b>接電池正極出來的電線、<b>短腳</b>接負極。放進水溶液的兩條電線不可以互相接觸。',
        answer:'正解：把 LED 轉過來，讓長腳接正極那一端。',
        sos:['食鹽水本來就容易導電，所以問題出在電路的哪個零件上？',
             '發光二極體的兩隻腳一長一短，接的方向有規定。',
             '圖上寫著哪一隻腳接在正極那一端？這樣對嗎？'] },

      { type:'find', icon:'⚖️', title:'找出最濃的那一杯',
        goal:'三個一樣重的燒杯都裝了 30 毫升的水，分別溶了 1、2、3 平匙的食鹽，全部溶光了，看起來都一樣。你最多可以檢驗 <b>3 次</b>。',
        ask:'哪一杯溶了 3 平匙食鹽？', beakers:['salt','salt','salt'], weights:[83,93,88], ans:1, tools:['scale','led','red'], budget:3, code:'WEIGHT_KEEP',
        learn:'物質溶解前、後<b>總重量不變</b>。水量一樣時，溶進去的食鹽越多，食鹽水越重、濃度也越高；蒸乾以後留下的食鹽也最多。',
        answer:'正解：用「電子秤」秤三杯，最重的乙杯（93 克重）溶的食鹽最多。',
        sos:['三杯都是食鹽水，酸鹼性和導電性會不一樣嗎？',
             '食鹽溶進水裡看不見了，它的重量還在嗎？',
             '例如一杯水加 1 匙糖、另一杯加 5 匙糖，哪一杯比較重？用同樣的想法選工具。'] },

      { type:'find', icon:'🌸', title:'用蝶豆花找出小蘇打水',
        goal:'試紙用完了，只剩自己泡的蝶豆花汁。三杯分別是食鹽水、小蘇打水、檸檬汁。你最多可以檢驗 <b>3 次</b>。',
        ask:'哪一杯是小蘇打水？', beakers:['salt','soda','lemon'], ans:1, tools:['bfly','led'], budget:3, code:'BFLY',
        learn:'蝶豆花汁是天然的酸鹼指示劑：遇酸性變<b>紫色</b>、中性維持<b>藍色</b>、遇鹼性變<b>綠色</b>。紫色高麗菜汁、紫葡萄皮也有花青素，同樣可以當指示劑。',
        answer:'正解：滴入蝶豆花汁後變成綠色的乙杯是鹼性的小蘇打水。',
        sos:['這三杯都容易導電，所以導電測試幫得上忙嗎？',
             '食鹽水、小蘇打水、檸檬汁，各是酸性、中性還是鹼性？',
             '蝶豆花汁本來是藍色的。遇到酸性和鹼性會各變成一種顏色，回想課本上那杯像星空的飲料。'] },

      { type:'find', icon:'🚰', title:'揭穿假的鹼性水',
        goal:'三牌瓶裝水都標榜自己是「鹼性水」，其實有一牌不是。你最多可以檢驗 <b>3 次</b>。',
        ask:'哪一牌不是鹼性水？', labels:['A 牌','B 牌','C 牌'],
        beakers:[{ph:'b',cond:1},{ph:'n',cond:1},{ph:'b',cond:1}], ans:1, tools:['led','red','blue'], budget:3, code:'COND_NOT_PH',
        learn:'會不會導電和酸鹼性是<b>兩回事</b>：三牌都會導電，卻不都是鹼性。要確認鹼性，要看<b>紅色</b>石蕊試紙會不會變成藍色。',
        answer:'正解：用「紅色石蕊試紙」驗三牌，不變色的 B 牌不是鹼性水。',
        sos:['「能讓 LED 發亮」可以說明它是酸性、中性還是鹼性嗎？',
             '紅色和藍色石蕊試紙，哪一種遇到鹼性才會變色？',
             '例如石灰水是鹼性，它會讓其中一種顏色的試紙變色，另一種不變。'] },

      { type:'mix', icon:'⚗️', title:'把醋調成中性',
        goal:'這杯醋加了蝶豆花汁，現在是紫色。請選一種水溶液<b>一滴一滴</b>加進去，把它調成<b>中性</b>再交出去。',
        learn:'酸性和鹼性水溶液以<b>適當的比例</b>混合，才會變成中性。胃藥中和胃酸、在酸化的土壤撒石灰、用酸性清潔劑洗馬桶的鹼性汙垢，都是酸鹼互相作用。',
        answer:'正解：選「小蘇打水」，滴到顏色剛好變成藍色（中性）就停下來交出去。',
        sos:['醋是酸性的。要讓它變成中性，要加入什麼性質的水溶液？',
             '蝶豆花汁在中性的時候是什麼顏色？那就是你要停下來的時候。',
             '農夫在酸化的土壤撒石灰粉，但是不會整包倒下去。為什麼？'] }
    ]},

  /* ---------------- L3 天氣圖偵察隊（天氣的變化：看圖判讀） ---------------- */
  { id:"L3", tier:"天氣圖判讀", name:"天氣圖偵察隊", mode:"spot", countdown:false, target:420,
    desc:"每一題是一張不同的圖：山景、水循環、衛星雲圖、地面天氣圖、颱風路徑。看懂圖，點出任務要找的位置。",
    hint:"先看清楚這是<b>哪一種圖</b>、圖上的符號和數字代表什麼，再點。點錯會扣分。",
    demo:{ emoji:'🛰️',
      intro:'這一關你是氣象偵察員。每一題有一張圖和一個要找的目標，在圖上（或圖下面的按鈕）點出它的位置。',
      example:'<div class="exrow"><span class="exbox">地面天氣圖上有 <b>H</b> 和 <b>L</b></span><span class="exarrow">→</span>'
            + '<span class="exbox">任務：找出容易下雨的地方</span><span class="exarrow">→</span>'
            + '<span class="exbox">點 <b>L</b> 附近的那一點</span></div>'
            + '<div class="exnote">L 是低氣壓中心：空氣上升、容易成雲下雨。H 是高氣壓中心：空氣下沉、晴朗穩定。</div>',
      steps:[ {t:'第一步：認出是什麼圖', d:'衛星雲圖看的是<b>雲的分布</b>；地面天氣圖看的是<b>氣壓和鋒面</b>。'},
              {t:'第二步：讀圖上的線索', d:'符號、數字、雲的形狀、箭頭的方向，都是線索。'},
              {t:'第三步：點出位置', d:'點圖上的圓圈，或點圖下面同名的按鈕。點錯會扣 3 分。'} ],
      note:'八題的圖都不一樣，每一題都要重新看圖。' },
    items:[
      { icon:'⛰️', title:'誰在霧裡', scene:xSpFog, spots:['甲','乙','丙'], ans:1, code:'CLOUD_FOG',
        goal:'山上有 A、B 兩團白茫茫的東西。有人打電話給大樹下的朋友說：「我現在<b>伸手不見五指</b>……」打電話的人在哪裡？',
        why:['甲在大樹下，四周是清楚的，他看到的 A、B 都是遠方的雲。','','丙在山頂，比 B 還高，四周沒有被小水滴包圍。'],
        learn:'雲和霧都是水蒸氣凝結成的小水滴或冰晶。<b>人在裡面</b>就覺得是霧，從遠處看就是雲。所以「雲深不知處」的師父，自己感受到的是霧。',
        sos:['「伸手不見五指」表示他被什麼東西包圍住了？','雲和霧的成分一樣，差別在你是從遠處看它，還是人在它裡面。','看圖：甲、乙、丙三個位置，哪一個在白茫茫的那一團裡面？'] },

      { icon:'♻️', title:'水循環的哪一站', scene:xSpCycle, spots:['甲','乙','丙','丁'], ans:1, code:'WATER_CYCLE',
        goal:'這是自然界的水循環。「水蒸氣遇冷，<b>凝結</b>成小水滴或直接變成冰晶」發生在圖上的哪一個位置？',
        why:['甲是海水受太陽照射，蒸發成水蒸氣。','','丙是雲裡的小水滴或冰晶變大變重，降落成雨、雪、雹。','丁是雨水匯集成河流，流回大海。'],
        learn:'水循環：海洋、地表的水<b>蒸發</b>（植物的水蒸散）成水蒸氣 → 上升到高空遇冷<b>凝結</b>成雲 → 降落成雨、雪、雹 → 匯集流回大海。讓水改變形態的主要因素是<b>溫度</b>。',
        sos:['凝結是「氣態的水蒸氣」變成「液態的小水滴」。','水蒸氣要遇冷才會凝結。圖上哪裡比較冷？','凝結出來的一大堆小水滴飄在空中，看起來是什麼？'] },

      { icon:'🧊', title:'哪一杯會結霜', scene:xSpCups, spots:['甲','乙','丙','丁'], ans:3, code:'FROST_SALT',
        goal:'「模擬露和霜的形成」實驗：四個杯子裡裝的東西不一樣。哪一個杯子的<b>外側</b>最有可能出現白色的<b>霜</b>？',
        why:['甲是常溫水，杯壁不夠冷，水蒸氣不會凝結。','乙是冰塊加水，溫度大約 0℃ 以上，杯壁外面出現的是小水珠（露）。','丙是熱水，杯壁是熱的，外側不會有水珠或冰晶。',''],
        learn:'冰塊加<b>食鹽</b>可以讓溫度降到 0℃ 以下，杯子外的水蒸氣附著在冰冷的杯壁上，直接變成冰晶，就是霜。只有冰塊和水的杯子，外側是小水珠，那是露。',
        sos:['霜是固態的冰晶，要在接近或低於 0℃ 的物體表面才會形成。','只放冰塊和水，溫度大約在 0℃ 以上。要怎樣才能讓它更冷？','實驗時在冰塊裡多加了一樣東西，目的就是把溫度降到 0℃ 以下。'] },

      { icon:'📈', title:'讀等壓線', scene:xSpIso, spots:['甲','乙','丙','丁'], ans:2, code:'ISOBAR',
        goal:'這是地面天氣圖的一部分，一圈一圈的線是等壓線，有兩條標了數字（單位：百帕）。哪一個點的氣壓是 <b>1004</b> 百帕？',
        why:['甲在低氣壓中心，是這張圖上氣壓最低的地方，比 996 還低。','乙在 996 那條線的裡面一圈，更靠近 L，氣壓是 992 百帕。','','丁就在標著 1000 的那條線上，氣壓是 1000 百帕。'],
        learn:'同一條<b>等壓線</b>上的氣壓相同，這張圖相鄰兩條線相差 4 百帕。越靠近 <b>L</b>（低氣壓中心）氣壓越低，越往外越高。',
        sos:['先看兩條有數字的線：從裡面到外面，數字是變大還是變小？','相鄰的兩條線差多少百帕？','1004 比 1000 大，所以它在 1000 那條線的裡面還是外面？'] },

      { icon:'🛰️', title:'衛星雲圖上的颱風', scene:xSpSat, spots:['甲','乙','丙','丁'], ans:3, code:'SAT_TY',
        goal:'這是一張衛星雲圖，白色的部分是雲。<b>颱風</b>在哪一個區域？',
        why:['甲是一條長長的雲帶，這種形狀通常是鋒面。','乙是零零散散的碎雲，沒有旋轉的形狀。','丙幾乎沒有雲，天氣比較晴朗。',''],
        learn:'衛星雲圖可以看出特定時間、特定區域<b>雲的分布</b>。颱風是一大團圓形、旋轉狀的雲，有些看得到中心沒有雲的<b>颱風眼</b>。氣溫、風力、雨量在衛星雲圖上看不出來。',
        sos:['衛星雲圖上的白色代表什麼？','颱風的雲是什麼形狀？想想氣象預報上看過的畫面。','長條形的雲帶和圓形旋轉的雲團，代表的是不同的天氣系統。'] },

      { icon:'🌀', title:'哪一個颱風最危險', scene:xSpPath, spots:['甲','乙','丙'], ans:0, code:'TY_PATH',
        goal:'三個<b>強度相同</b>的颱風，行進路徑如圖。哪一個可能對臺灣造成<b>最大</b>的災害？',
        why:['','乙從臺灣東方的海面往北走，中心沒有登陸，離臺灣比較遠。','丙從臺灣南方的海面往西走，中心沒有登陸。'],

/* ============================================================
   L1 天氣製造機
   G.st = { sel:{控制項:值}, out:最近一次啟動的結果, done, act }
   改了任何一個設定，上一次的結果就清掉（回到「只顯示設定」的畫面）
   ============================================================ */
function stageWx(it){
  G.st={ sel:{}, out:null, done:false, act:null };
  return '<div class="xgoal"><span class="xgi">'+it.icon+'</span><div><b>任務</b>'+it.goal+'</div></div><div id="zone"></div>';
}
function xMissing(it, sel){
  if(it.cards) return it.cards.some(function(c){ return sel[c[0]]; }) ? [] : ['至少選一張行動卡'];
  return it.ctrls.filter(function(c){ return sel[c.k]===undefined; }).map(function(c){ return c.lab; });
}
function paintWx(){
  var it=G.lv.items[G.qi], st=G.st, h='';
  if(it.cards){
    var lvl = st.out ? st.out.lvl : null;
    h+='<div class="xgauge"><div class="xgbar"><i class="xgz"></i>'
      + (lvl===null?'':'<span class="xgm" style="left:'+lvl+'%">▼</span>')+'</div>'
      + '<div class="xglab"><span>🟢 排放量低</span><span>'+(lvl===null?'按啟動才會知道排放量':esc(st.out.name))+'</span><span>排放量高 🔴</span></div></div>'
      + '<div class="xcards">'+it.cards.map(function(c){
          return '<button class="xcard'+(st.sel[c[0]]?' on':'')+'" data-c="'+c[0]+'"'+(st.done?' disabled':'')+'>'
               + '<span class="xck">'+(st.sel[c[0]]?'☑':'☐')+'</span>'+esc(c[1])+'</button>';
        }).join('')+'</div>';
  }else{
    h+='<div class="xscene">'+it.scene(st.sel, st.out)+'</div>'
      + it.ctrls.map(function(c){
          return '<div class="xctl"><span class="xlab">'+esc(c.lab)+'</span><div class="xopts">'
               + c.opts.map(function(o){
                   return '<button class="xopt'+(st.sel[c.k]===o[0]?' on':'')+'" data-k="'+c.k+'" data-v="'+o[0]+'"'+(st.done?' disabled':'')+'>'+esc(o[1])+'</button>';
                 }).join('')+'</div></div>';
        }).join('');
  }
  h+='<div class="xrunrow"><button class="xrun" id="xrun"'+(st.done?' disabled':'')+'>▶ 啟動</button></div>';
  document.getElementById('zone').innerHTML=h;

  Array.prototype.forEach.call(document.querySelectorAll('#zone .xopt'),function(b){
    b.onclick=function(){
      if(G.frozen||G.st.done) return;
      var c=it.ctrls.filter(function(x){ return x.k===b.dataset.k; })[0];
      var o=c.opts.filter(function(x){ return String(x[0])===b.dataset.v; })[0];
      G.st.sel[c.k]=o[0]; G.st.out=null; sPick(); paintWx();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('#zone .xcard'),function(b){
    b.onclick=function(){
      if(G.frozen||G.st.done) return;
      G.st.sel[b.dataset.c]=!G.st.sel[b.dataset.c]; G.st.out=null; sPick(); paintWx();
    };
  });
  var rb=document.getElementById('xrun');
  if(rb) rb.onclick=function(){ if(G.frozen||G.st.done) return; G.st.act='run'; sDrop(); check(); };
}

    noCheck: true,

    bind:  paintWx,
    sos:   function(it){ return it.sos; },
    judge: function(it){
      var st=G.st, a=st.act; st.act=null;
      if(st.done) return {halt:true, msg:'這一題已經完成了，按「下一題」。'};
      if(!a) return {halt:true, msg:'把條件設定好，再按「▶ 啟動」。'};
      var miss=xMissing(it, st.sel);

      G.st.done=true;

  }
};

var XLIQ = {
  water:  {ph:'n', cond:0, evap:'什麼都沒留下'},
  tap:    {ph:'n', cond:1, evap:'留下一點點白色痕跡'},
  salt:   {ph:'n', cond:1, evap:'留下白色顆粒'},
  sugar:  {ph:'n', cond:0, evap:'留下白色顆粒'},
  alcohol:{ph:'n', cond:0, evap:'什麼都沒留下'},
  soda:   {ph:'b', cond:1, evap:'留下白色粉末'},
  vinegar:{ph:'a', cond:1, evap:'什麼都沒留下'},
  lemon:  {ph:'a', cond:1, evap:'留下一點點黃色痕跡'}
};
var XTOOL = {
  red:  {n:'紅色石蕊試紙', i:'🟥'},
  blue: {n:'藍色石蕊試紙', i:'🟦'},
  led:  {n:'LED 導電測試', i:'💡'},
  evap: {n:'蒸發皿（把水蒸乾）', i:'🔥'},
  bfly: {n:'蝶豆花汁', i:'🌸'},
  scale:{n:'電子秤', i:'⚖️'}
};
var XLAB = ['甲','乙','丙','丁'];
function xLiq(it,i){ var b=it.beakers[i]; return typeof b==='string' ? XLIQ[b] : b; }
function xLabel(it,i){ return it.labels ? it.labels[i] : XLAB[i]+' 杯'; }
function xTest(t, it, i){
  var q=xLiq(it,i);
  if(t==='red')   return q.ph==='b' ? '變成藍色' : '不變色';
  if(t==='blue')  return q.ph==='a' ? '變成紅色' : '不變色';
  if(t==='led')   return q.cond ? 'LED 發亮' : 'LED 不亮';
  if(t==='evap')  return q.evap;
  if(t==='bfly')  return q.ph==='a' ? '變成紫色' : (q.ph==='b' ? '變成綠色' : '維持藍色');
  if(t==='scale') return '連燒杯共 '+it.weights[i]+' 克重';
  return '';
}
/* 調配題：醋＋蝶豆花汁，一滴一滴加。只有小蘇打水會讓顏色改變 */

}

/* ============================================================
   L3 電磁起重機
   有 it.ctrls 的題目沿用 L1 的「設定條件→啟動」；其他題目是電磁鐵組裝台（it.init）
   rig = { bats:[1|-1|0…], conn:'s'|'p', turns, wind:'same'|'mix', core }
   ============================================================ */
var XCORE = [['cu','銅棒','#c87533'],['al','鋁棒','#cfd6da'],['iron','鐵釘','#7f8a92'],['pl','塑膠棒','#f2c94c']];
function xRigOut(r, it){
  var b=r.bats.filter(function(x){ return x!==0; }), n=b.length, o={n:n, cells:0, dir:0, clips:0, after:0, fault:null};
  if(!n) o.fault='NOBAT';
  else{
    var same=b.every(function(x){ return x===b[0]; });
    if(!same) o.fault='REV';
    else { o.dir=b[0]; o.cells=(n>1 && r.conn==='p') ? 1 : n; }
  }
  if(!o.fault && r.wind==='mix') o.fault='WIND';
  if(!o.fault && r.core!=='iron') o.fault='CORE';
  if(!o.fault){
    o.clips=o.cells*(r.turns/30)*2;
    o.after=(n>1 && r.conn==='p') ? (r.turns/30)*2 : 0;     /* 拔掉一顆電池以後還能吸幾支 */
  }
  return o;
}
var XFAULT = {
  NOBAT:{name:'完全沒有磁力', why:'沒有裝電池，線圈裡沒有電流。', code:'RIG_REV'},
  REV:  {name:'完全沒有磁力', why:'電池的方向不一致，正、負極沒有接對，電通不過去。', code:'RIG_REV'},
  WIND: {name:'完全沒有磁力', why:'線圈一半順時針、一半逆時針，產生的磁性互相抵消了。', code:'RIG_WIND'},
  CORE: {name:'吸不起迴紋針', why:'線圈通電後有磁性，但是裡面不是鐵，磁力太弱。', code:'RIG_CORE'}
};
function xScRig(r, o, it){
  var h='', n=r.bats.length, par=(r.conn==='p' && n>1), bats=r.bats.slice();
  /* 拔電池那一題：通電後把最後一顆畫成空的 */
  if(o && it.pull){ for(var z=bats.length-1;z>=0;z--){ if(bats[z]!==0){ bats[z]=0; break; } } }
  /* 電池 */
  bats.forEach(function(b,i){
    var x= par ? 110 : 30+i*86, y= par ? 40+i*50 : 92;
    if(b===0){ h+='<rect x="'+x+'" y="'+y+'" width="74" height="30" rx="6" fill="none" stroke="#8a949c" stroke-width="3" stroke-dasharray="6 5"/>'+xT(x+37,y+21,'空',15,'#6b7b85'); return; }
    h+='<rect x="'+x+'" y="'+y+'" width="74" height="30" rx="6" fill="#ffd45e" stroke="#8a5a00" stroke-width="3"/>'
      + '<rect x="'+(b>0?x+74:x-6)+'" y="'+(y+9)+'" width="6" height="12" fill="#8a5a00"/>'
      + xT(b>0?x+60:x+14, y+22, '＋', 18, '#b3261e') + xT(b>0?x+14:x+60, y+22, '－', 18, '#16323c');
  });
  if(n>1) h+=xTag(150,222,r.conn?(par?'並聯':'串聯'):'接法？','#1f5568');
  /* 棒子與線圈 */
  var core=XCORE.filter(function(c){ return c[0]===r.core; })[0];
  if(core) h+='<rect x="330" y="96" width="240" height="20" rx="6" fill="'+core[2]+'" stroke="#48535a" stroke-width="2"/>';
  else     h+='<rect x="330" y="96" width="240" height="20" rx="6" fill="none" stroke="#8a949c" stroke-width="3" stroke-dasharray="6 5"/>';
  var loops=r.turns ? r.turns/30*5 : 0;
  for(var i=0;i<loops;i++){
    var mix=(r.wind==='mix' && i>=loops/2);
    h+='<ellipse cx="'+(352+i*(196/Math.max(loops-1,1)))+'" cy="106" rx="7" ry="24" fill="none" stroke="'+(mix?'#2f6fdc':'#b5651d')+'" stroke-width="4"/>';
  }
  h+=xT(450,62,(r.turns?'線圈 '+r.turns+' 圈':'還沒繞線圈')+(core?'・'+core[1]:''),16);
  if(r.wind==='mix') h+=xT(450,40,'一半順時針、一半逆時針',14,'#12337a');
  h+='<path d="M'+(par?196:30+n*86-6)+',107 H330 M570,107 H590 V190 H12 V107 H'+(par?104:24)+'" fill="none" stroke="#48535a" stroke-width="3"/>';
  if(o){
    if(o.clips>0 || (!o.fault)){
      h+=xT(340,90,o.dir>0?'N':'S',22,'#b3261e')+xT(560,90,o.dir>0?'S':'N',22,'#12337a');
    }
    var show = it.pull ? o.after : o.clips;
    if(show>0) h+=xT(520,150,'📎'+(show>1?'📎':'')+(show>3?'📎':''),22)+xTag(500,178,'吸起 '+show+' 支','#1d7f50');
    else h+=xTag(500,160,'吸不起來','#8f3418');
    if(it.pull) h+=xTag(300,222,'已拔掉一顆電池','#8f3418');
  }
  return xSvg(h,'#eef3f1');
}
function stageRig(it){
  var i=it.init;
  G.st={ rig:{ bats:i.bats.slice(), conn:i.conn, turns:i.turns, wind:i.wind, core:i.core }, out:null, done:false, act:null };
  return '<div class="xgoal"><span class="xgi">'+it.icon+'</span><div><b>任務</b>'+it.goal+'</div></div><div id="zone"></div>';
}
function xRigRow(lab, key, opts, cur, locked, done){
  return '<div class="xctl"><span class="xlab">'+(locked?'🔒 ':'')+lab+'</span><div class="xopts">'
       + opts.map(function(o){
           return '<button class="xopt'+(cur===o[0]?' on':'')+'" data-rk="'+key+'" data-v="'+o[0]+'"'+((locked||done)?' disabled':'')+'>'+o[1]+'</button>';
         }).join('')+'</div></div>';
}
function paintRig(){
  var it=G.lv.items[G.qi], st=G.st, r=st.rig, L=it.lock||{}, d=st.done;
  var h='<div class="xscene">'+xScRig(r, st.out, it)+'</div>';
  h+='<div class="xctl"><span class="xlab">電池（點一下換方向）</span><div class="xopts">'
    + r.bats.map(function(b,i){
        return '<button class="xbat'+(b===0?' empty':'')+'" data-b="'+i+'"'+(d?' disabled':'')+'>'
             + (b===0?'空的':(b>0?'－ 🔋 ＋':'＋ 🔋 －'))+'</button>'; }).join('')+'</div></div>';
  if(r.bats.length>1) h+=xRigRow('電池的接法','conn',[['s','串聯'],['p','並聯']],r.conn,L.conn,d);
  h+=xRigRow('線圈圈數','turns',(it.turnOpts||[30,60,90]).map(function(t){ return [t,t+' 圈']; }),r.turns,L.turns,d);
  h+=xRigRow('線圈的纏法','wind',[['mix','一半順時針、一半逆時針'],['same','同一個方向']],r.wind,L.wind,d);
  h+=xRigRow('線圈裡的棒子','core',XCORE.map(function(c){ return [c[0],c[1]]; }),r.core,L.core,d);
  h+='<div class="xrunrow"><button class="xrun" id="xrun"'+(d?' disabled':'')+'>▶ 通電測試</button></div>';
  document.getElementById('zone').innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('#zone .xbat'),function(b){
    b.onclick=function(){
      if(G.frozen||G.st.done) return;
      var i=+b.dataset.b, cur=G.st.rig.bats[i];
      /* 空 → 正 → 反 → 空；noEmpty 的題目只在正、反之間切換 */
      G.st.rig.bats[i] = it.noEmpty ? -cur : (cur===0?1:(cur===1?-1:0));
      G.st.out=null; sPick(); paintRig();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('#zone .xopt[data-rk]'),function(b){
    b.onclick=function(){
      if(G.frozen||G.st.done) return;
      var k=b.dataset.rk; G.st.rig[k] = k==='turns' ? +b.dataset.v : b.dataset.v;
      G.st.out=null; sPick(); paintRig();
    };
  });
  var rb=document.getElementById('xrun');
  if(rb) rb.onclick=function(){ if(G.frozen||G.st.done) return; G.st.act='run'; sDrop(); check(); };
}
function xRigMissing(r){
  var m=[];
  if(r.bats.length>1 && !r.conn) m.push('電池的接法');
  if(!r.turns) m.push('線圈圈數');
  if(!r.wind) m.push('線圈的纏法');
  if(!r.core) m.push('線圈裡的棒子');
  return m;
}
/* 5 通電的電線和指北針 */
function xScWire(sel,out){
  var h='<circle cx="300" cy="120" r="78" fill="#fff" stroke="#48535a" stroke-width="4"/>'+xT(300,62,'北',16,'#6b7b85')+xT(300,192,'南',16,'#6b7b85');
  var ang = out ? -out.sign*(out.n===1?18:42) : 0;      /* 向左偏是負角度；啟動前指針指向北方 */
  var needle='<g transform="rotate('+(-ang)+' 300 120)"><polygon points="300,60 290,120 310,120" fill="#e0483c"/><polygon points="300,180 290,120 310,120" fill="#cfd6da" stroke="#8a949c"/></g>';
  var wire='<line x1="300" y1="12" x2="300" y2="228" stroke="#b5651d" stroke-width="7" '+(sel.pos==='down'?'stroke-dasharray="10 8" opacity=".55"':'')+'/>';
  h += sel.pos==='down' ? wire+needle : needle+(sel.pos?wire:'');
  if(sel.pos) h+=xTag(110,40,sel.pos==='up'?'電線在上方':'電線在下方','#8a5a00');
  if(sel.dir) h+=xTag(110,120,sel.dir==='f'?'電池正接':'電池反接','#1f5568');
  if(sel.n)   h+=xTag(110,200,sel.n===1?'1 顆電池':'串聯 2 顆','#1f5568');
  if(out) h+=xTag(490,120,out.sign>0?(out.n===1?'向右偏':'向右偏很多'):(out.n===1?'向左偏':'向左偏很多'),out.ok?'#1d7f50':'#8f3418');
  else h+=xTag(490,120,'還沒通電','#6b7b85');
  return xSvg(h,'#eef3f1');
}

/* 8 自製指北針 */
function xScCompass(sel,out){

/* ============================================================
   L4 公平實驗擂台
   G.st = { pick:[卡片索引…最多兩個], done, act }
   ============================================================ */
function xFairDiff(it,a,b){
  var d=[]; it.attrs.forEach(function(n,k){ if(it.cards[a].v[k]!==it.cards[b].v[k]) d.push(k); });
  return d;
}
function xFairAns(it){
  for(var a=0;a<it.cards.length;a++) for(var b=a+1;b<it.cards.length;b++){
    var d=xFairDiff(it,a,b); if(d.length===1 && d[0]===it.target) return [a,b];
  }
  return null;
}
function stageFair(it){

}

    }).join('')+'</div>'

  document.getElementById('zone').innerHTML=h;

}

MODES_A.lab = {
  choice: function(){ return !!(G.st && G.st.pen); },     /* 指認、選做法才罰；檢驗和調配不罰 */
  noCheck: true,
  sub:   function(it){ return it.type==='find' ? '先點工具，再點燒杯檢驗；有把握了再指認'
                            : (it.type==='act' ? '選一個做法，看看會發生什麼事' : '一滴一滴加，顏色對了就交出去'); },
  title: function(it){ return '任務 '+(G.qi+1)+'：'+esc(it.title); },
  stage: stageLab,
  bind:  paintLab,
  sos:   function(it){ return it.sos; },
  judge: function(it){
    var st=G.st, a=st.act; st.act=null; st.pen=false;

function ySvg(inner, bg){
  return '<svg class="yvsvg" viewBox="0 0 600 240" xmlns="http://www.w3.org/2000/svg">'
       + '<rect width="600" height="240" fill="'+(bg||'#dff1fb')+'"/>'+inner+'</svg>';
}
function yT(x,y,t,size,fill,anchor){
  return '<text x="'+x+'" y="'+y+'" font-size="'+(size||18)+'" font-weight="800" fill="'+(fill||'#1f1633')
       + '" text-anchor="'+(anchor||'middle')+'">'+t+'</text>';
}
function yTag(x,y,t,fill){
  var w=t.length*19+18;
  return '<rect x="'+(x-w/2)+'" y="'+(y-21)+'" width="'+w+'" height="30" rx="9" fill="#fff" opacity=".93" stroke="'+(fill||'#54407e')+'" stroke-width="2"/>'
       + yT(x,y,t,18,fill||'#54407e');
}
function yCloud(x,y,s,fill){
  fill=fill||'#fff';
  return '<g fill="'+fill+'" stroke="#9bb4c2" stroke-width="2"><ellipse cx="'+x+'" cy="'+y+'" rx="'+(46*s)+'" ry="'+(20*s)+'"/>'
       + '<ellipse cx="'+(x-22*s)+'" cy="'+(y-12*s)+'" rx="'+(24*s)+'" ry="'+(17*s)+'"/>'
       + '<ellipse cx="'+(x+18*s)+'" cy="'+(y-15*s)+'" rx="'+(28*s)+'" ry="'+(20*s)+'"/></g>';
}
var Y_MAP = '<path d="M0,0 L340,0 L310,38 L262,66 L240,118 L176,158 L122,148 L62,188 L0,178 Z" fill="#e8d9a8" stroke="#c9b87a" stroke-width="2"/>'
          + '<ellipse cx="365" cy="150" rx="13" ry="30" transform="rotate(14 365 150)" fill="#7fbf7a" stroke="#3f8a45" stroke-width="2"/>';
function yFront(type,dx,dy){
  var ax=230+dx, ay=228+dy, bx=500+dx, by=78+dy;
  var len=Math.sqrt((bx-ax)*(bx-ax)+(by-ay)*(by-ay)), ux=(bx-ax)/len, uy=(by-ay)/len, nx=-uy, ny=ux;
  var col= type==='cold'?'#2f6fdc':(type==='warm'?'#e0483c':'#6b4fb0');
  var h='<line x1="'+ax+'" y1="'+ay+'" x2="'+bx+'" y2="'+by+'" stroke="'+col+'" stroke-width="4"/>';
  for(var i=0;i<5;i++){
    var t=0.12+i*0.19, px=ax+(bx-ax)*t, py=ay+(by-ay)*t;
    var tri=(type==='cold')||(type==='stay'&&i%2===0);
    if(tri) h+='<polygon points="'+(px-ux*9)+','+(py-uy*9)+' '+(px+ux*9)+','+(py+uy*9)+' '+(px+nx*15)+','+(py+ny*15)+'" fill="#2f6fdc"/>';
    else    h+='<path d="M'+(px-ux*9)+','+(py-uy*9)+' A9,9 0 0 1 '+(px+ux*9)+','+(py+uy*9)+' Z" fill="#e0483c"/>';
  }
  return h;
}
function yIso(cx,cy,letter,col){
  return '<g fill="none" stroke="#6b7b85" stroke-width="2"><ellipse cx="'+cx+'" cy="'+cy+'" rx="44" ry="32"/><ellipse cx="'+cx+'" cy="'+cy+'" rx="84" ry="60"/><ellipse cx="'+cx+'" cy="'+cy+'" rx="124" ry="88"/></g>'
       + yT(cx,cy+14,letter,40,col);
}
function yArrow(x1,y1,x2,y2,col){
  var a=Math.atan2(y2-y1,x2-x1), hx=x2-14*Math.cos(a), hy=y2-14*Math.sin(a), px=Math.sin(a)*8, py=-Math.cos(a)*8;
  return '<line x1="'+x1+'" y1="'+y1+'" x2="'+hx+'" y2="'+hy+'" stroke="'+(col||'#1f1633')+'" stroke-width="5" stroke-linecap="round"/>'
       + '<polygon points="'+x2+','+y2+' '+(hx+px)+','+(hy+py)+' '+(hx-px)+','+(hy-py)+'" fill="'+(col||'#1f1633')+'"/>';
}

    items:[
      { icon:'👓', title:'熱湯麵的眼鏡', story:'阿凱低頭吃熱騰騰的湯麵，眼鏡一下子就白茫茫的。',
        cards:[ ['a','湯麵冒出大量水蒸氣'], ['b','水蒸氣碰到比較冷的鏡片'], ['c','水蒸氣凝結成小水滴'], ['d','鏡片起霧，成因和露一樣'] ],
        traps:[ ['x','水蒸氣直接變成冰晶','鏡片沒有冷到 0℃ 以下，水蒸氣凝結成的是小水滴，不是冰晶。'], ['y','鏡片上的水是從眼睛流出來的','眼鏡上的水來自湯麵冒出的水蒸氣。'] ],
        code:'CHAIN_DEW', learn:'水蒸氣遇到較冷的物體表面<b>凝結</b>成小水滴，和清晨草葉上的<b>露</b>成因相同。',
        sos:['白茫茫的東西，是從哪裡來的水變成的？','水蒸氣遇到比較冷的東西，會變成什麼形態？','鏡片有冷到 0℃ 以下嗎？'] },
      { icon:'🧊', title:'飲料攤的結霜杯', story:'小晴想讓客人看看「霜」是怎麼來的，在攤位上做了一個實驗。',
        cards:[ ['a','杯子裡放冰塊和水'], ['b','再加入食鹽攪拌'], ['c','杯子的溫度降到 0℃ 以下'], ['d','杯外出現白色的冰晶（霜）'] ],

        sos:['霜是固態的冰晶，要冷到幾度才會形成？','只有冰塊和水，溫度大約是幾度？要加什麼才能更冷？','冰晶是哪裡來的水變的？在杯子裡面還是外面？'] },
      { icon:'⛰️', title:'山上的白茫茫', story:'園遊會那天早上，學校後面的山腰飄著一大團白白的東西。',
        cards:[ ['a','太陽晒熱地表的水'], ['b','水蒸發成水蒸氣往上升'], ['c','水蒸氣在高空遇冷凝結'], ['d','小水滴和冰晶飄在空中成為雲'] ],

        code:'CHAIN_CLOUD', learn:'地表的水<b>蒸發</b>成看不見的水蒸氣，上升到高空遇冷<b>凝結</b>成小水滴或冰晶，就是雲。人走進雲裡，感受到的是霧。',
        sos:['水蒸氣看得見嗎？','水蒸氣要遇到什麼才會變成小水滴？','高空的雲裡面，除了冰晶還有什麼？'] },
      { icon:'🌨️', title:'合歡山的雪', story:'寒流來的時候，合歡山上下雪了，平地卻在下雨。',

        code:'CHAIN_SNOW', learn:'雲中的冰晶落到地面時<b>沒有融化</b>就是雪；途中融化就是雨。所以臺灣要在寒流時的高山上才看得到雪。',
        sos:['雪是什麼形態的水？從哪裡落下來？','冰晶落下的時候，經過溫暖的空氣會怎樣？','要讓冰晶一路都不融化，氣溫要多低？'] },

        cards:[ ['a','大樹的根從土裡吸收水分'], ['b','葉子把水蒸散成水蒸氣'], ['c','水蒸氣上升凝結成雲'], ['d','雲降下雨水，又回到土裡'] ],
        traps:[ ['x','雨水直接流進水管變成自來水','雨水要經過自來水廠處理，才會變成自來水。'], ['y','月亮讓水一直循環','讓水改變形態、不斷循環的是溫度的變化，不是月亮。'] ],

        sos:['植物的水是從哪裡吸進來的？','葉子把水變成什麼，送回空氣中？','雨落到地上以後，會回到哪裡？'] },

        sos:['看不見了，就等於沒有了嗎？要用什麼來證明它還在？','「溶解」和「融化」一樣嗎？','先發生的是攪拌、看不見，還是喝到甜味？'] },

        code:'CHAIN_EVAP', learn:'讓水溶液中的水<b>蒸發</b>，溶在水裡的食鹽就會變回顆粒。早期的鹽田就是晒海水取得粗鹽。',

    ]},

  /* ---------------- L3 化驗闖關：接通電路（導電） ---------------- */

      { icon:'🧪', title:'做一杯對照組', goal:'要先做一杯「<b>對照組</b>」，用來配製其他水溶液。對照組通電後 LED <b>必須不亮</b>，但電路其他地方都要接對。',

/* ============================================================
   L1 攤位進貨大作戰

function yGoods(it){ return it.goods || Y_GOODS; }
function yShopReport(it, sel){
  var need=it.need, names={}, rows=[], gain=0;
  yGoods(it).forEach(function(g){ names[g[0]]=g[1]+' '+g[2]; });
  if(it.single){
    var right=!!sel[need[0]];
    return { rows:[ right ? '✅ 新竹的柳橙用貨車運來就好，運送的碳足跡小。' : '✈️ 美國的柳橙要搭飛機再轉貨車，運送排放的二氧化碳多得多。' ],
             gain: right ? 200 : -100 };
  }
  if(sel.close && need.indexOf('close')<0){ rows.push('🚫 你沒有擺攤，白白錯過了一天生意。'); gain-=100; }
  Object.keys(sel).forEach(function(k){
    if(!sel[k] || k==='close') return;
    if(need.indexOf(k)>=0){ rows.push('✅ '+names[k]+' 全部賣光'); gain+=200; }
    else { rows.push('📦 '+names[k]+' 沒人買，賠錢'); gain-=100; }
  });
  need.forEach(function(k){
    if(k!=='close' && !sel[k]) rows.push('😣 客人想買 '+names[k]+'，可是你沒有進貨');
  });
  if(need.indexOf('close')>=0 && !sel.close){ rows.push('🌀 颱風天還擺攤，貨被吹走、淋溼了！'); gain-=300; }
  if(need.indexOf('close')>=0 && sel.close) rows.push('🏠 這天沒擺攤，平平安安。');
  return {rows:rows, gain:gain};
}
function stageShop(it){
  if(G.money===undefined) G.money=1000;
  G.st={ sel:{}, done:false, act:null, last:null };
  return '<div class="yvgoal"><span class="yvgi">'+it.icon+'</span><div><b>'+esc(it.date)+'</b>'+it.info+'</div></div>'
       + '<div class="yvwallet">💰 攤位的錢：<b id="yvmoney">'+G.money+'</b> 元</div><div id="zone"></div>';
}
function paintShop(){
  var it=G.lv.items[G.qi], st=G.st, d=st.done?' disabled':'';
  var h='<div class="yvscene">'+it.scene()+'</div>'
      + '<div class="yvask">'+(it.single?'選一家進貨：':'這天要進哪些貨？（可以選一樣或兩樣）')+'</div>'

  document.getElementById('zone').innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('#zone .yvgood'),function(b){

             if(Object.keys(s).length>2){ s[k]=false; delete s[k]; showFb('no','最多只能進兩樣貨，先取消一樣。'); sTap(); return; } }

/* ============================================================
   L2 骨牌連鎖
   G.st = { order:[已放的卡 id], deck:[洗好的手牌 id], fall:倒到第幾張, stop:卡住的格, done, act }
   ============================================================ */
function yShuffle(arr, seed){
  var a=arr.slice(), s=(seed*9301+49297)%233280;
  for(var i=a.length-1;i>0;i--){ s=(s*9301+49297)%233280; var j=Math.floor(s/233280*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function yCard(it,id){
  var all=it.cards.concat(it.traps);
  return all.filter(function(c){ return c[0]===id; })[0];
}
function stageChain(it){
  var ids=it.cards.concat(it.traps).map(function(c){ return c[0]; });
  /* 洗牌，但不讓正解剛好照順序排在最前面 */
  var deck=yShuffle(ids, G.qi+3);
  if(deck.slice(0,it.cards.length).join()===it.cards.map(function(c){return c[0];}).join()) deck.reverse();
  G.st={ order:[], deck:deck, fall:-1, stop:-1, done:false, act:null };
  return '<div class="yvgoal"><span class="yvgi">'+it.icon+'</span><div><b>題目</b>'+esc(it.story)+'</div></div><div id="zone"></div>';
}
function paintChain(){
  var it=G.lv.items[G.qi], st=G.st, n=it.cards.length, d=st.done?' disabled':'';
  var h='<div class="yvchain">';
  for(var i=0;i<n;i++){
    var id=st.order[i], c=id?yCard(it,id):null;
    var cls='yvdom'+(c?'':' empty')+(st.fall>=i?' fell':'')+(st.stop===i?' stuck':'');
    h+=(i?'<span class="yvlink">→</span>':'')
      + '<button class="'+cls+'" data-i="'+i+'"'+(c?'':' disabled')+(st.done?' disabled':'')+'><i>'+(i+1)+'</i>'+(c?esc(c[1]):'空格')+'</button>';
  }
  h+='</div><div class="yvask">手上的卡片（點一張放進下一個空格）：</div><div class="yvhand">'
    + st.deck.map(function(id){
        var used=st.order.indexOf(id)>=0, c=yCard(it,id);
        return '<button class="yvcard'+(used?' used':'')+'" data-c="'+id+'"'+((used||st.done)?' disabled':'')+'>'+esc(c[1])+'</button>';
      }).join('')+'</div>'
    + '<div class="yvrunrow"><button class="yvrun" id="yvrun"'+d+'>👉 推倒骨牌</button></div>';
  document.getElementById('zone').innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('#zone .yvcard'),function(b){
    b.onclick=function(){
      if(G.frozen||G.st.done) return;
      if(G.st.order.length>=it.cards.length){ showFb('no','空格都放滿了。點骨牌可以把卡片拿回來。'); sTap(); return; }
      G.st.order.push(b.dataset.c); G.st.fall=-1; G.st.stop=-1; sPick(); paintChain();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('#zone .yvdom:not(.empty)'),function(b){
    b.onclick=function(){
      if(G.frozen||G.st.done) return;
      G.st.order.splice(+b.dataset.i,1); G.st.fall=-1; G.st.stop=-1; sTap(); paintChain();
    };
  });
  var rb=document.getElementById('yvrun');
  if(rb) rb.onclick=function(){ if(G.frozen||G.st.done) return; G.st.act='run'; sDrop(); check(); };
}

/* ============================================================
   L3 化驗闖關：接通電路
   G.st = { put:[每個缺口放的卡 id 或 null], tog:{開關:值}, out:{lit, ok, why}, done, act }
   ============================================================ */
function yHand(it,id){ return it.hand.filter(function(c){ return c[0]===id; })[0]; }
function yPathEval(it, st){
  var led = st.tog.led ? st.tog.led==='ok' : true;
  var conduct = true, badWhy='';
  if(it.fixed){
    var fixedCond = {'食鹽水':1,'砂糖水':0,'純水':0}[it.fixed];
    if(st.tog.wire==='touch') fixedCond=1;            /* 電線相碰：電直接走電線 */
    if(st.tog.rinse==='dirty') fixedCond=1;           /* 沾著食鹽水：純水被汙染 */
    conduct = !!fixedCond;
  } else {
    for(var i=0;i<st.put.length;i++){
      var c=yHand(it, st.put[i]);
      if(!c[2]){ conduct=false; badWhy=c[3]||''; break; }
    }
  }
  var lit = conduct && led;
  var o={ lit:lit, ok:false, why:'' };
  if(it.want==='on'){
    o.ok = lit;
    o.why = lit ? '' : (!led ? '發光二極體的長腳接到負極了，電通不過去。' : badWhy);
  } else if(it.want==='off'){
    if(!led) { o.why='發光二極體接反了，就算材料會導電也不會亮，這樣的對照組沒有意義。'; }
    else { o.ok = !lit; o.why = lit ? (yHand(it, st.put[0])[3] || '') : ''; }
  } else {
    /* custom：電線要分開、要先沖洗，LED 接對，結果才是可信的「不亮」 */
    var fair = (st.tog.wire ? st.tog.wire==='apart' : true) && (st.tog.rinse ? st.tog.rinse==='clean' : true);
    if(!led) o.why='發光二極體接反了，這樣什麼都測不出來。';
    else if(!fair) o.why = st.tog.wire==='touch' ? 'LED 亮了，可是電是從碰在一起的電線走過去的，根本沒有經過砂糖水。'
                                                 : 'LED 微微亮了，因為電線上殘留的食鹽水跑進了純水裡。';
    else o.ok=true;
  }
  return o;
}
function yScPath(it, st){
  /* 一整圈電路：上排是電池（＋在右）→ LED → 右邊往下 → 下排由右往左經過缺口 → 左邊往上回到電池的－ */
  var o=st.out, lit=o&&o.lit, led=st.tog.led?st.tog.led==='ok':true, W='#48535a';
  var h='<rect x="40" y="22" width="110" height="36" rx="7" fill="#ffd45e" stroke="#8a5a00" stroke-width="3"/>'
       + '<rect x="150" y="32" width="9" height="16" fill="#8a5a00"/>'+yT(134,47,'＋',18,'#b3261e')+yT(56,47,'－',18);
  /* LED：長腳在左（接電池正極那一邊）＝接對 */
  h+='<path d="M159,40 H292 M348,40 H560 V110 M20,110 V40 H40" fill="none" stroke="'+W+'" stroke-width="5"/>'
    + '<path d="M292,40 V28 q0,-24 28,-24 q28,0 28,24 V40 Z" fill="'+(lit?'#ffe066':'#fff')+'" stroke="'+W+'" stroke-width="3"/>';
  if(lit) h+='<g stroke="#f2b705" stroke-width="4" stroke-linecap="round"><line x1="282" y1="10" x2="268" y2="2"/><line x1="358" y1="10" x2="372" y2="2"/><line x1="276" y1="30" x2="260" y2="30"/><line x1="364" y1="30" x2="380" y2="30"/></g>';
  h+=yT(300,64,led?'長腳':'短腳',13,'#4a5b65')+yT(340,64,led?'短腳':'長腳',13,'#4a5b65');
  /* 下排的缺口 */
  var slots = it.fixed ? ['cup'] : it.slots, xs = slots.length===1 ? [300] : [420,200];
  var gaps=[];
  slots.forEach(function(kind,i){ gaps.push(kind==='cup' ? [xs[i]-22, xs[i]+22] : [xs[i]-50, xs[i]+50]); });
  gaps.sort(function(a,b){ return b[0]-a[0]; });
  var x=560;
  gaps.forEach(function(g){ h+='<line x1="'+x+'" y1="110" x2="'+g[1]+'" y2="110" stroke="'+W+'" stroke-width="5"/>'; x=g[0]; });
  h+='<line x1="'+x+'" y1="110" x2="20" y2="110" stroke="'+W+'" stroke-width="5"/>';
  slots.forEach(function(kind,i){
    var cx=xs[i], name = it.fixed ? it.fixed : (st.put[i] ? yHand(it,st.put[i])[1] : '？');
    if(kind==='cup'){
      var touch = st.tog.wire==='touch';
      h+='<path d="M'+(cx-44)+',140 L'+(cx-38)+',218 L'+(cx+38)+',218 L'+(cx+44)+',140" fill="#eaf6ff" stroke="#557080" stroke-width="3"/>'
        + '<rect x="'+(cx-38)+'" y="168" width="76" height="48" fill="#bfe3f7" opacity=".75"/>'
        + yT(cx,236,esc(name),15);
      if(touch) h+='<path d="M'+(cx-22)+',110 V196 L'+(cx-2)+',204 M'+(cx+22)+',110 V196 L'+(cx+2)+',204" fill="none" stroke="'+W+'" stroke-width="4"/>';
      else      h+='<path d="M'+(cx-22)+',110 V200 M'+(cx+22)+',110 V200" fill="none" stroke="'+W+'" stroke-width="4"/>';
      if(st.tog.rinse==='dirty') h+=yT(cx+70,150,'電線沾著',13,'#8f3418','start')+yT(cx+70,168,'食鹽水',13,'#8f3418','start');
    }else{
      var filled=!!st.put[i];
      h+='<rect x="'+(cx-50)+'" y="92" width="100" height="36" rx="8" fill="'+(filled?'#fff':'#f3efe4')+'" stroke="#8a949c" stroke-width="3"/>'
        + yT(cx,116,esc(name),16);
    }
  });
  if(o) h+=yTag(470,80,lit?'💡 LED 亮了':'LED 不亮',o.ok?'#1d7f50':'#8f3418');
  return ySvg(h,'#f4f7f6');
}
function stagePath(it){
  var tog={}; (it.toggles||[]).forEach(function(t){ tog[t.k]=t.init; });
  G.st={ put:(it.slots||[]).map(function(){ return null; }), tog:tog, out:null, done:false, act:null };
  return '<div class="yvgoal"><span class="yvgi">'+it.icon+'</span><div><b>任務</b>'+it.goal+'</div></div><div id="zone"></div>';

  Array.prototype.forEach.call(document.querySelectorAll('#zone .yvopt'),function(b){
    b.onclick=function(){ if(G.frozen||G.st.done) return; G.st.tog[b.dataset.k]=b.dataset.v; G.st.out=null; sPick(); paintPath(); };

   G.st = { step:第幾步, val:你的杯子, pick:[選的卡], act, done, picked:[每一步選的卡名] }
   ============================================================ */
function yColor(it, v){
  if(v===null || v===undefined) return {c:'#eef4f7', t:'？'};
  if(it.ind==='bfly') return v<0 ? {c:'#8e44c4', t:'偏紫色'} : (v>0 ? {c:'#2fa46b', t:'偏綠色'} : {c:'#2f6fdc', t:'藍色'});
  return {c:'#eef4f7', t:'透明無色'};
}
function yCupHTML(it, who, v, label, note){
  var c=yColor(it, v);
  return '<div class="yvcup"><div class="yvwho">'+who+'</div><div class="yvglass"><i style="background:'+c.c+'"></i></div>'
       + '<div class="yvcupt">'+(label||'')+'</div>'+(note?'<div class="yvcupn">'+note+'</div>':'')+'</div>';
}
function yLitmus(v){
  if(v===null||v===undefined) return '';
  return '紅色試紙'+(v>0?'<b>變藍</b>':'不變色')+'、藍色試紙'+(v<0?'<b>變紅</b>':'不變色');
}
function stageDuel(it){
  G.st={ step:0, val:it.hidden?null:it.start, pick:[], act:null, done:false, picked:[] };
  return '<div class="yvgoal"><span class="yvgi">'+it.icon+'</span><div><b>目標</b>'+it.goal+'</div></div><div id="zone"></div>';
}
function paintDuel(){
  var it=G.lv.items[G.qi], st=G.st, d=st.done?' disabled':'';
  var oppNote = it.opp.res===null ? '他宣布：「中性！」' : (it.ind==='litmus' ? yLitmus(it.opp.res) : (it.ind==='bfly' ? yColor(it,it.opp.res).t : ''));
  var myNote = it.ind==='litmus' ? yLitmus(st.val) : (it.ind==='bfly' ? yColor(it,st.val).t : (st.done && it.result ? '藍色石蕊試紙變紅色' : ''));
  var h='<div class="yvduel">'
      + yCupHTML(it,'😏 阿凱的杯子', it.ind==='bfly'?it.opp.res:null, '阿凱出「'+esc(it.opp.card)+'」<div class="yvsay">「'+esc(it.opp.say)+'」</div>', oppNote)
      + '<div class="yvvs">VS</div>'
      + yCupHTML(it,'🙂 你的杯子', it.ind==='bfly'?st.val:null, (st.claim?'你判斷它是「'+esc(st.claim)+'」<br>':'')+(st.picked.length?'你出了「'+st.picked.map(esc).join('」「')+'」':'還沒出牌'), myNote)
      + '</div>';
  if(!st.done){
    var cards, ask;
    if(it.pick2){ cards=it.cards.map(function(c){ return c[0]; }); ask='選兩杯倒在一起：'; }
    else { cards=it.steps[st.step].opts.map(function(o){ return o[0]; }); ask=it.steps[st.step].ask; }
    h+='<div class="yvask">'+ask+'</div><div class="yvhand">'+cards.map(function(c){
          return '<button class="yvcard duel'+(st.pick.indexOf(c)>=0?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>';
        }).join('')+'</div>'
      + '<div class="yvrunrow"><button class="yvrun" id="yvrun">🃏 出牌</button></div>';
  }
  document.getElementById('zone').innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('#zone .yvcard.duel'),function(b){
    b.onclick=function(){
      if(G.frozen||G.st.done) return;
      var c=b.dataset.c, p=G.st.pick, at=p.indexOf(c);
      if(it.pick2){ if(at>=0) p.splice(at,1); else { if(p.length>=2) p.shift(); p.push(c); } }
      else G.st.pick = at>=0 ? [] : [c];
      sPick(); paintDuel();
    };
  });
  var rb=document.getElementById('yvrun');
  if(rb) rb.onclick=function(){ if(G.frozen||G.st.done) return; G.st.act='play'; sDrop(); check(); };
}

    },

      return '正解：'+it.steps.map(function(s){ return s.opts.filter(function(o){ return !o[2]; })[0][0]; }).join(' → ')+'。';

  }
};
